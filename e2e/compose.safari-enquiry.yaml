# credentials. The synthetic analytics ID is intercepted by Playwright.
services:
  backend:
    environment:
      TOURS_OPERATOR_BOOKING_MODE: ENQUIRY_ONLY
      TOURS_OPERATOR_PAYMOB_MOCK_ENABLED: "false"
  safari-site:
    environment:
      NUXT_PUBLIC_GA4_ID: G-ENQUIRYTEST
