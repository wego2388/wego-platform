name: foundation-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        # scripts/repository-check.sh depends on `rg`, which ubuntu-24.04
        # runners do not ship by default.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify repository invariants
        run: bash scripts/repository-check.sh

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: foundry/pnpm-lock.yaml
      - run: pnpm --dir foundry install --frozen-lockfile
      - run: pnpm --dir foundry run validate
      - name: Prove release generation is deterministic and committed
        run: |
          pnpm --dir foundry run generate:release
          git diff --exit-code -- 'clients/*/release.lock.json' 'clients/*/release.plan.json'
          pnpm --dir foundry run generate:release
          git diff --exit-code -- 'clients/*/release.lock.json' 'clients/*/release.plan.json'

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Verify all isolated backend applications
        run: >-
          ./gradlew
          :platform:application:check
          :platform:apps:sharm-to-go:check
          :platform:apps:safari-tours-sharm:check
      - name: Build and scan isolated backend artifacts
        run: |
          ./gradlew :platform:application:bootJar :platform:apps:sharm-to-go:bootJar :platform:apps:safari-tours-sharm:bootJar

          divers_jar="platform/application/build/libs/application-0.1.0-SNAPSHOT.jar"
          travel_jar="platform/apps/sharm-to-go/build/libs/sharm-to-go-0.1.0-SNAPSHOT.jar"
          safari_jar="platform/apps/safari-tours-sharm/build/libs/safari-tours-sharm-0.1.0-SNAPSHOT.jar"

          divers_entries="$(jar tf "$divers_jar")"
          travel_entries="$(jar tf "$travel_jar")"
          safari_entries="$(jar tf "$safari_jar")"

          grep -q 'BOOT-INF/classes/com/wego/divers/' <<< "$divers_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/toursoperator/' <<< "$divers_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/travelmarketplace/' <<< "$divers_entries"

          grep -q 'BOOT-INF/classes/com/wego/travelmarketplace/' <<< "$travel_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/divers/' <<< "$travel_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/toursoperator/' <<< "$travel_entries"

          grep -q 'BOOT-INF/classes/com/wego/toursoperator/' <<< "$safari_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/divers/' <<< "$safari_entries"
          ! grep -q 'BOOT-INF/classes/com/wego/travelmarketplace/' <<< "$safari_entries"

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - run: ./gradlew :mobile:shared:check :mobile:apps:ops:check :mobile:apps:customer:check :mobile:apps:sharm-to-go:check :mobile:apps:customer-android:assembleDebug :mobile:apps:sharm-to-go-android:assembleDebug

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run check

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Sharm Divers Club isolated Compose model
        run: docker compose --env-file .env.example -f infrastructure/compose/sharm-divers-club.compose.yaml config --quiet
      - name: Validate Safari Tours Sharm isolated Compose model
        run: >-
          docker compose --env-file .env.example
          -f infrastructure/compose/safari-tours-sharm.compose.yaml
          -f e2e/compose.safari-checkout.yaml
          config --quiet
      - name: Validate Sharm To Go VPS Compose model
        run: docker compose --env-file .env.sharm-to-go.example -f infrastructure/compose/sharm-to-go.compose.yaml --profile tls config --quiet
      - name: Build and start isolated Sharm Divers Club stack
        run: |
          # Anonymous pulls of the pinned public.ecr.aws/docker/library/{postgres,redis,nginx}
          # images intermittently return "toomanyrequests: Rate exceeded" under GitHub Actions'
          # shared runner IP pool — a registry-side throttle, not a problem with the pinned
          # digests themselves (the same images have passed cleanly on every other run this
          # week). Retry with backoff instead of failing the whole job on a transient throttle.
          attempt=1
          until docker compose --env-file .env.example -f infrastructure/compose/sharm-divers-club.compose.yaml up --build --wait -d; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Foundation stack failed to start after $attempt attempts"
              exit 1
            fi
            echo "Attempt $attempt failed to start the stack, retrying in $((attempt * 20))s..."
            sleep "$((attempt * 20))"
            attempt=$((attempt + 1))
          done
      - name: Verify edge health, ERP HTML, and API protection
        run: |
          curl --fail --silent --show-error http://127.0.0.1:58080/healthz

          # The public and staff apps have deliberately separate origins.
          # Public /login must not expose the ERP; staff /login must render it.
          public_login_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:58080/login)"
          test "$public_login_status" = "404"
          erp_headers="$(curl --silent --resolve staff.localhost:58080:127.0.0.1 --dump-header - --output /tmp/erp-login.html http://staff.localhost:58080/login)"
          echo "$erp_headers" | grep -q '^HTTP/[0-9.]* 200'
          echo "$erp_headers" | grep -qi '^Content-Type: *text/html'
          echo "$erp_headers" | grep -qi '^Content-Security-Policy:'
          echo "$erp_headers" | grep -qi '^X-Frame-Options: *DENY'
          grep -qi '<title' /tmp/erp-login.html

          # Public origin cannot reach the staff/domain API at all.
          public_api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:58080/api/v1/identity/me)"
          test "$public_api_status" = "404"

          # The same unauthenticated request on the staff origin reaches the
          # backend's deny-by-default boundary and returns a Bearer challenge.
          deny_headers="$(curl --silent --resolve staff.localhost:58080:127.0.0.1 --dump-header - --output /dev/null http://staff.localhost:58080/api/v1/identity/me)"
          echo "$deny_headers" | grep -q '^HTTP/[0-9.]* 401'
          echo "$deny_headers" | grep -qi '^WWW-Authenticate: *Bearer'
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm --dir e2e install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Seed the E2E staff user and pagination fixture data
        env:
          WEGO_POSTGRES_PORT: 55432
          WEGO_POSTGRES_USER: wego_app
          WEGO_POSTGRES_PASSWORD: wego-local-postgres-only
          WEGO_POSTGRES_DB: wego
          WEGO_E2E_SEED_CONFIRM: yes-this-is-a-disposable-e2e-database
          WEGO_E2E_PRODUCT: divers
        run: pnpm --dir e2e run seed
      - name: Run the authenticated foundation ERP browser lifecycle (Playwright)
        env:
          WEGO_E2E_BASE_URL: http://staff.localhost:58080
        run: pnpm --dir e2e exec playwright test tests/erp-lifecycle.spec.ts
      - name: Stop the disposable Sharm Divers Club stack
        run: docker compose --env-file .env.example -f infrastructure/compose/sharm-divers-club.compose.yaml down --volumes
      - name: Start the isolated Safari Tours Sharm stack
        run: >-
          docker compose --env-file .env.example
          -f infrastructure/compose/safari-tours-sharm.compose.yaml
          -f e2e/compose.safari-checkout.yaml
          up --build --wait -d
      - name: Seed the isolated Safari staff user and catalog fixture
        env:
          WEGO_POSTGRES_PORT: 55432
          WEGO_POSTGRES_USER: wego_app
          WEGO_POSTGRES_PASSWORD: wego-local-postgres-only
          WEGO_POSTGRES_DB: wego
          WEGO_E2E_SEED_CONFIRM: yes-this-is-a-disposable-e2e-database
          WEGO_E2E_PRODUCT: safari
        run: pnpm --dir e2e run seed
      - name: Verify Safari public and staff route separation
        run: |
          staff_lookup_status="$(curl --silent --resolve staff.localhost:58080:127.0.0.1 --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"reference":"STR-2026-1","phone":"+201000000000"}' \
            http://staff.localhost:58080/api/v1/tours-operator/bookings/lookup)"
          test "$staff_lookup_status" = "404"
      - name: Run the Safari checkout and staff-visibility lifecycle (Playwright)
        env:
          WEGO_E2E_BASE_URL: http://127.0.0.1:58080
          WEGO_STS_SITE_BASE_URL: http://127.0.0.1:58080
          WEGO_STS_STAFF_BASE_URL: http://staff.localhost:58080
        run: pnpm --dir e2e exec playwright test tests/safari-checkout.spec.ts
      - name: Verify public booking lookup rate limiting
        run: |
          lookup_rate_limited=0
          for i in $(seq 1 20); do
            response="$(curl --silent --dump-header /tmp/booking-lookup-rate-limit-headers.txt \
              -X POST http://127.0.0.1:58080/api/v1/tours-operator/bookings/lookup \
              -H 'Content-Type: application/json' \
              -d "{\"reference\":\"STR-2026-$i\",\"phone\":\"+201099999999\"}")"
            if grep -q '^HTTP/[0-9.]* 429' /tmp/booking-lookup-rate-limit-headers.txt; then
              lookup_rate_limited=1
              break
            fi
          done
          test "$lookup_rate_limited" = "1"
          echo "$response" | grep -q '"error":"rate_limited"'
          grep -qi '^Content-Type: *application/json' /tmp/booking-lookup-rate-limit-headers.txt
          grep -qi '^Retry-After: *[0-9]' /tmp/booking-lookup-rate-limit-headers.txt
      - name: Verify Safari checkout logs do not retain query secrets or customer PII
        run: |
          compose_logs="$(docker compose --env-file .env.example -f infrastructure/compose/safari-tours-sharm.compose.yaml -f e2e/compose.safari-checkout.yaml logs --no-color)"
          if rg -qi 'valid-hmac|hmac=wrong|rejected hmac=|STR-[0-9]{4}-[0-9]+|E2E Test Customer|\+20100000099|\+201099999999|e2e-safari@example\.com|"source_data"|"pan"[[:space:]]*:[[:space:]]*"1234"|payment_token=' <<< "$compose_logs"; then
            echo "Checkout HMAC, customer PII, or raw webhook data was retained in Compose logs" >&2
            exit 1
          fi
          rg -q '"POST /api/v1/tours-operator/payments/paymob-callback HTTP/[0-9.]+"' <<< "$compose_logs"
      - name: Verify login rate limiting
        # Deliberately last: this step exhausts nginx's edge-level login
        # limiter (login_rate: 5r/m, burst 3) on purpose. Running it before
        # the Playwright E2E step risked the E2E login's very first request
        # landing inside that same exhausted window and failing with 429 —
        # reproduced live against this exact ordering before being moved
        # here, not a theoretical concern.
        run: |
          # Two independent rate limiters guard login (see SECURITY_MODEL.md):
          # nginx per-IP (infrastructure/nginx/nginx.conf) and the
          # application per-account (LoginAttemptThrottle). Reusing one email
          # across every attempt only ever proves the *application* layer —
          # it rejects the second attempt long before ten requests could
          # exercise nginx's own counter — so each layer gets its own loop
          # with the assertions and requests it needs to actually reach.

          # Layer 1: the application-level per-account throttle. Same email
          # every time; the second attempt must already be rejected.
          app_rate_limited=0
          for _ in $(seq 1 5); do
            response="$(curl --silent --dump-header /tmp/app-rate-limit-headers.txt \
              -X POST http://127.0.0.1:58080/api/v1/identity/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"app-throttle-target@example.com","password":"wrong"}')"
            if grep -q '^HTTP/[0-9.]* 429' /tmp/app-rate-limit-headers.txt; then
              app_rate_limited=1
              app_rate_limit_body="$response"
              break
            fi
          done
          test "$app_rate_limited" = "1"

          # Layer 2: nginx's edge-level, per-IP limiter (login_rate zone:
          # 5r/m, burst 3, nodelay). A distinct email per attempt keeps the
          # application throttle out of the way entirely, so only nginx's
          # own counter (keyed by $binary_remote_addr, not the request body)
          # can be what eventually returns 429 here.
          edge_rate_limited=0
          for i in $(seq 1 10); do
            response="$(curl --silent --dump-header /tmp/edge-rate-limit-headers.txt \
              -X POST http://127.0.0.1:58080/api/v1/identity/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"edge-throttle-target-$i@example.com\",\"password\":\"wrong\"}")"
            if grep -q '^HTTP/[0-9.]* 429' /tmp/edge-rate-limit-headers.txt; then
              edge_rate_limited=1
              edge_rate_limit_body="$response"
              break
            fi
          done
          test "$edge_rate_limited" = "1"

          # Both layers must present the same JSON contract every other login
          # response uses (see LoginError in the OpenAPI document), not
          # nginx's default HTML error page, and both must carry Retry-After
          # so a well-behaved client knows when to retry regardless of which
          # layer caught it.
          assert_rate_limit_contract() {
            echo "$1" | grep -q '"error":"rate_limited"'
            grep -qi '^Content-Type: *application/json' "$2"
            grep -qi '^Retry-After: *[0-9]' "$2"
          }
          assert_rate_limit_contract "$app_rate_limit_body" /tmp/app-rate-limit-headers.txt
          assert_rate_limit_contract "$edge_rate_limit_body" /tmp/edge-rate-limit-headers.txt
      - name: Build and start isolated Sharm To Go stack
        env:
          COMPOSE_PROJECT_NAME: ci-sharm-to-go
        run: |
          docker compose --env-file .env.sharm-to-go.example \
            -f infrastructure/compose/sharm-to-go.compose.yaml up --build --wait -d
          curl --fail --silent --show-error http://127.0.0.1:58180/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:58180/login)" = "404"
          test "$(curl --silent --resolve admin.sharmtogo.example:58181:127.0.0.1 --output /dev/null --write-out '%{http_code}' http://admin.sharmtogo.example:58181/login)" = "200"
      - name: Stop disposable Sharm To Go stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ci-sharm-to-go
        run: docker compose --env-file .env.sharm-to-go.example -f infrastructure/compose/sharm-to-go.compose.yaml down --volumes --remove-orphans || true
      - name: Upload Playwright report after a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/test-results
          retention-days: 7
      - name: Show logs after a failure
        if: failure()
        run: |
          docker compose --env-file .env.example -f infrastructure/compose/sharm-divers-club.compose.yaml logs --no-color || true
          docker compose --env-file .env.example -f infrastructure/compose/safari-tours-sharm.compose.yaml -f e2e/compose.safari-checkout.yaml logs --no-color || true
      - name: Stop scoped client stacks
        if: always()
        run: |
          docker compose --env-file .env.example -f infrastructure/compose/sharm-divers-club.compose.yaml down --volumes --remove-orphans || true
          docker compose --env-file .env.example -f infrastructure/compose/safari-tours-sharm.compose.yaml -f e2e/compose.safari-checkout.yaml down --volumes --remove-orphans || true

  secrets-and-node-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.34.4
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm --dir foundry audit --audit-level=high
      - run: pnpm --dir web audit --audit-level=high
      - run: pnpm --dir e2e audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  gradle-dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/dependency-submission@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
