# =============================================================================
# Safari Tours Sharm — gateway virtual hosts (FULL / live variant)
# =============================================================================
# Install as a NEW file, e.g. /etc/nginx/conf.d/safaritourssharm.com.conf or
# sites-available + symlink — whatever layout the existing gateway uses.
# Touches NOTHING of El Kheima: no default_server, no global directives, no
# change to any other server block. Requires owner GO for the shared reload.
#
# Prerequisites (see DEPLOY_RUNBOOK_AR.md):
#   1. snippets/safari-tours-sharm-proxy.inc installed;
#   2. Safari stack healthy on 127.0.0.1:58080 (change BOTH occurrences of the
#      port below if Codex picked another SAFARI_EDGE_PORT);
#   3. certificate for safaritourssharm.com + www + staff already issued via
#      the ACME bootstrap file (otherwise `nginx -t` fails on missing certs).
#
# LISTEN LINES: copy the exact form the existing gateway uses for its 443
# servers (e.g. `listen 443 ssl;` + `http2 on;` on nginx >= 1.25.1, or
# `listen 443 ssl http2;` on older builds; same IPv6 options). Mismatched
# listen options on a shared socket make `nginx -t` fail. Never add
# `default_server` here.
#
# IPv6 (review finding 1): every `listen [::]:…` line is COMMENTED OUT on
# purpose. If El Kheima has no `[::]` listeners, the first Safari server on
# [::]:80/443 would become the IPv6 default and answer El Kheima's AAAA
# traffic. Enable them only if runbook §1 shows El Kheima already listens on
# [::] with its own server blocks (and keep El Kheima's default_server there).
# HSTS (finding 7): no includeSubDomains until the owner confirms there is no
# HTTP-only subdomain (mail/webmail/cpanel from the old host).
# If the gateway runs INSIDE a container, 127.0.0.1 is that container, not the
# host: STOP and let Codex choose an approved path (see runbook §STOP).
# =============================================================================

upstream safari_tours_sharm_edge {
    server 127.0.0.1:58080;
    keepalive 8;
}

# --- Port 80: ACME challenge + redirect to HTTPS -----------------------------
server {
    listen 80;
    # listen [::]:80;  # IPv6: see header — enable only per runbook §1
    server_name safaritourssharm.com staff.safaritourssharm.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/safari-tours-sharm-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    # listen [::]:80;  # IPv6: see header — enable only per runbook §1
    server_name www.safaritourssharm.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/safari-tours-sharm-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://safaritourssharm.com$request_uri;
    }
}

# --- www -> apex (path and query preserved) ---------------------------------
server {
    listen 443 ssl;
    # listen [::]:443 ssl;  # IPv6: see header — enable only per runbook §1
    http2 on;
    server_name www.safaritourssharm.com;

    ssl_certificate     /etc/letsencrypt/live/safaritourssharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safaritourssharm.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://safaritourssharm.com$request_uri;
}

# --- Public site: safaritourssharm.com --------------------------------------
server {
    listen 443 ssl;
    # listen [::]:443 ssl;  # IPv6: see header — enable only per runbook §1
    http2 on;
    server_name safaritourssharm.com;

    ssl_certificate     /etc/letsencrypt/live/safaritourssharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safaritourssharm.com/privkey.pem;

    access_log /var/log/nginx/safari-tours-sharm.access.log;
    error_log  /var/log/nginx/safari-tours-sharm.error.log warn;

    # Public origin accepts only small JSON bodies (edge limit 64k).
    client_max_body_size 1m;

    location / {
        include /etc/nginx/snippets/safari-tours-sharm-proxy.inc;
    }
}

# --- Staff ERP + staff/identity APIs: staff.safaritourssharm.com ------------
server {
    listen 443 ssl;
    # listen [::]:443 ssl;  # IPv6: see header — enable only per runbook §1
    http2 on;
    server_name staff.safaritourssharm.com;

    ssl_certificate     /etc/letsencrypt/live/safaritourssharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safaritourssharm.com/privkey.pem;

    access_log /var/log/nginx/safari-tours-sharm-staff.access.log;
    error_log  /var/log/nginx/safari-tours-sharm-staff.error.log warn;

    # Media upload limit: Spring multipart 10MB file / 11MB request, edge
    # 11m on the upload route (2m elsewhere). 12m here so the edge/backend
    # return their own JSON 413 instead of a bare gateway error page.
    client_max_body_size 12m;

    location / {
        # Staff pages must never be indexed (the ERP also sends meta robots).
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/safari-tours-sharm-proxy.inc;
    }
}
