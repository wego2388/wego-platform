# =============================================================================
# Safari Tours Sharm — ACME BOOTSTRAP variant (HTTP only, before any cert)
# =============================================================================
# Purpose: let certbot --webroot prove the three Safari names WITHOUT stopping
# port 80 and WITHOUT changing what visitors see today. For every non-ACME
# path it keeps the current behaviour (redirect to https://<same host>), so
# HTTPS keeps being answered by whatever the gateway serves now until the
# full variant replaces this file.
#
# Install as the Safari vhost file, `nginx -t`, graceful reload (owner GO),
# run certbot (runbook), then REPLACE this file with safaritourssharm.com.conf.
# Never keep both files enabled: they declare the same server_names.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name safaritourssharm.com www.safaritourssharm.com staff.safaritourssharm.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/safari-tours-sharm-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
