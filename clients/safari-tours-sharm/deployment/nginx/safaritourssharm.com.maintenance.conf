# =============================================================================
# Safari Tours Sharm — MAINTENANCE variant (HTTPS, app NOT exposed)
# =============================================================================
# Use only after a SEPARATE owner approval (Codex brief §7.6), e.g. when the
# certificate is ready but the Safari release is not, or during a restore.
# Serves a static 503 + Retry-After + noindex for apex and staff, keeps
# www -> apex and the ACME webroot working, and never proxies to the app.
# Swap with safaritourssharm.com.conf (never enable both), `nginx -t`, reload.
#
# Install the page: /srv/safari-tours-sharm/shared/maintenance/index.html
# (copy of deployment/nginx/maintenance/index.html, readable by nginx).
# Same LISTEN-LINE rule as the full variant: mirror the gateway's own form.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name safaritourssharm.com www.safaritourssharm.com staff.safaritourssharm.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/safari-tours-sharm-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.safaritourssharm.com;

    ssl_certificate     /etc/letsencrypt/live/safaritourssharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safaritourssharm.com/privkey.pem;

    return 301 https://safaritourssharm.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name safaritourssharm.com staff.safaritourssharm.com;

    ssl_certificate     /etc/letsencrypt/live/safaritourssharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safaritourssharm.com/privkey.pem;

    root /srv/safari-tours-sharm/shared/maintenance;
    client_max_body_size 1k;

    location = /maintenance.html {
        internal;
        add_header Retry-After 3600 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =503;
    }
    location / {
        error_page 503 /maintenance.html;
        return 503;
    }
}
