            - string
            - "null"
          maxLength: 32
        email:
          type:
            - string
            - "null"
          maxLength: 320
    CreateTravelRequestRequest:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - serviceOptionId
        - requestedDate
        - adults
        - locale
        - sourceChannel
        - customer
        - expectedPriceAmount
        - expectedPriceCurrency
      properties:
        serviceId:
          type: string
          format: uuid
        serviceOptionId:
          type: string
          format: uuid
        requestedDate:
          type: string
          format: date
          description: Must be in the future.
        requestedTime:
          type:
            - string
            - "null"
          format: time
        adults:
          type: integer
          minimum: 1
        children:
          type: integer
          minimum: 0
          default: 0
        hotelOrPickup:
          type:
            - string
            - "null"
          maxLength: 500
        locale:
          type: string
          enum:
            - en
            - ar
        notes:
          type:
            - string
            - "null"
          maxLength: 2000
        sourceChannel:
          $ref: "#/components/schemas/TravelRequestSourceChannel"
        customer:
          $ref: "#/components/schemas/TravelRequestCustomer"
        expectedPriceAmount:
          type: string
          description: >-
            The price the caller's own review screen displayed for this
            option. Decimal string, 2 places. Compared against the option's
            real current price; a mismatch (the owner edited the catalog
            between review and submit) is rejected with 409 price_changed
            rather than silently confirmed at the new price.
        expectedPriceCurrency:
          type: string
    CancelTravelRequestRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          $ref: "#/components/schemas/TravelRequestCancelReason"
        detail:
          type:
            - string
            - "null"
          maxLength: 1000
    TravelRequestErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - service_not_found
            - option_not_found
            - party_size_exceeds_capacity
            - price_changed
            - invalid_transition
            - already_terminal
            - request_state_changed
            - validation_failed
        message:
          type:
            - string
            - "null"
          description: >-
            Populated for error == validation_failed (a Bean Validation
            failure, e.g. a malformed phone or a past date) — the real
            exception handler's own message. Absent for the structured
            domain errors above, whose error code alone is the message.
        currentPriceAmount:
          type:
            - string
            - "null"
          description: Populated only for error == price_changed. Decimal string, 2 places.
        currentPriceCurrency:
          type:
            - string
            - "null"
          description: Populated only for error == price_changed.
    TravelRequestPublicResponse:
      type: object
      additionalProperties: false
      required:
        - reference
        - status
        - serviceName
        - optionLabel
        - priceAmount
        - priceCurrency
        - priceBasis
        - cancellationPolicy
        - requestedDate
        - adults
        - children
        - createdAt
      properties:
        reference:
          type: string
        status:
          $ref: "#/components/schemas/TravelRequestStatus"
        serviceName:
          $ref: "#/components/schemas/LocalizedText"
        optionLabel:
          $ref: "#/components/schemas/LocalizedText"
        priceAmount:
          type: string
        priceCurrency:
          type: string
        priceBasis:
          $ref: "#/components/schemas/PriceBasis"
        cancellationPolicy:
          $ref: "#/components/schemas/LocalizedText"
        requestedDate:
          type: string
          format: date
        requestedTime:
          type:
            - string
            - "null"
          format: time
        adults:
