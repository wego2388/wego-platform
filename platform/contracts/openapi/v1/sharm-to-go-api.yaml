        - IN_REVIEW
        - CONFIRMED
        - COMPLETED
        - CANCELLED
        - EXPIRED
    TravelRequestSourceChannel:
      type: string
      enum:
        - WEBSITE
        - MOBILE
    TravelRequestCancelReason:
      type: string
      enum:
        - CUSTOMER_REQUESTED
        - STAFF_REJECTED
        - SERVICE_UNAVAILABLE
        - DUPLICATE_REQUEST
        - OTHER
    TravelRequestCustomer:
      type: object
