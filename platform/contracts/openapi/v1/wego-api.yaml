        - amount
      properties:
        accountId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        amount:
          type: string
    IncomeStatementResponse:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - revenueLines
        - expenseLines
        - totalRevenue
        - totalExpenses
        - netIncome
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        revenueLines:
          type: array
          items:
            $ref: "#/components/schemas/IncomeStatementLineResponse"
        expenseLines:
          type: array
          items:
            $ref: "#/components/schemas/IncomeStatementLineResponse"
        totalRevenue:
          type: string
        totalExpenses:
          type: string
        netIncome:
          type: string
    BalanceSheetLineResponse:
      type: object
      additionalProperties: false
      description: >-
        `accountId`/`code` are absent on exactly one line — the
        synthesized "Retained Earnings (accumulated)" figure, which has
        no backing account row.
      required:
        - name
        - amount
      properties:
        accountId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        amount:
          type: string
    BalanceSheetResponse:
      type: object
      additionalProperties: false
      description: >-
        `totalAssets` must equal `totalLiabilities + totalEquity` —
        `equityLines` mixes real equity accounts with one computed
        Retained Earnings line so the equation holds even though this
        system never formally closes Revenue/Expense into Equity.
      required:
        - asOfDate
        - assetLines
        - liabilityLines
        - equityLines
        - totalAssets
        - totalLiabilities
        - totalEquity
      properties:
        asOfDate:
          type: string
          format: date
        assetLines:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLineResponse"
        liabilityLines:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLineResponse"
        equityLines:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLineResponse"
        totalAssets:
          type: string
        totalLiabilities:
          type: string
        totalEquity:
          type: string
