  /api/v1/tours-operator/bookings:
    post:
      operationId: createToursOperatorBooking
      summary: Create a temporary public booking
      description: >-
        Creates a NEW booking and reserves one place per guest. The price is
        computed by the server. It is not payment
        confirmation and must never be presented as CONFIRMED.
      tags:
        - ToursOperator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToursOperatorBookingRequest"
      responses:
        "201":
          description: NEW booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "404":
          description: Slot not found.
        "409":
          description: Slot blocked or already in the past (slot_in_past), not enough places left for the party, or tour inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "422":
          description: >-
            Pricing does not fit the tour — price_option_required,
            unit_count_required, guests_exceed_units, units_exceed_guests,
            price_option_not_applicable or child_price_not_available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "503":
          description: >-
            Manager pause (bookings_paused) or enquiry-only deployment
            (online_booking_unavailable). No booking or inventory hold is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
    get:
      operationId: listToursOperatorBookings
      summary: List bookings for staff
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ToursOperatorBookingStatus"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Staff-visible bookings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/bookings/lookup:
    post:
      operationId: lookupToursOperatorBooking
      summary: Recover a booking by reference and phone
      description: >-
        Public recovery endpoint. The reference and phone are knowledge
        factors, not a staff identity. They are accepted only in the JSON body
        so PII is not placed in URLs; the edge applies a dedicated per-IP rate
        limit to reduce enumeration attempts.
      tags:
        - ToursOperator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupToursOperatorBookingRequest"
      responses:
        "200":
          description: Matching booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorPublicBookingLookupResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "404":
          description: No matching booking.
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
  /api/v1/tours-operator/bookings/{id}:
    get:
      operationId: getToursOperatorBooking
      summary: Get a booking for staff
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
  /api/v1/tours-operator/bookings/{id}/history:
    get:
      operationId: getToursOperatorBookingHistory
      summary: Booking lifecycle history for staff
