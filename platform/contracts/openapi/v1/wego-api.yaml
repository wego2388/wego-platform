          description: EGP per 1 EUR at today's manager-set rate; null when no rate is set today.
          anyOf:
          - type: string
          - type: 'null'
        expectedReturnEgp:
          description: The expected return at todayRate (half-up to cents); null when no rate is set.
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        refunds:
          type: array
          description: Money handed back so far (OPS2-F), oldest first; reversals listed and netted.
          items:
            type: object
            additionalProperties: false
            required:
            - recordedAt
            - reversal
            - method
            - amountPaid
            - returnedEur
            properties:
              recordedAt:
                type: string
                format: date-time
              reversal:
                type: boolean
              method:
                $ref: '#/components/schemas/ToursOperatorRefundMethod'
              amountPaid:
                $ref: '#/components/schemas/ToursOperatorAmount'
              returnedEur:
                $ref: '#/components/schemas/Money'
        refundedNet:
          $ref: '#/components/schemas/Money'
        remainingToReturn:
          $ref: '#/components/schemas/Money'
        returnState:
          type: string
          enum:
          - NONE_DUE
          - NOT_RETURNED
          - PARTIALLY_RETURNED
          - RETURNED
          description: RETURNED = "money returned" (refunded ≥ the policy amount).
