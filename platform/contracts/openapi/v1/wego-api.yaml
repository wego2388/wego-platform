                  required: [revision]
      responses:
        "200": { $ref: "#/components/responses/ToursOperatorMediaUploaded" }
        "400": { $ref: "#/components/responses/ToursOperatorMediaInvalid" }
        "401": { $ref: "#/components/responses/UnauthenticatedResponse" }
        "403": { $ref: "#/components/responses/ForbiddenResponse" }
        "404": { description: Unknown category. }
        "409": { description: draft_changed. }
        "413": { description: Upload exceeds limit. }
        "503": { description: storage_failed or upload_busy. }
  /api/v1/tours-operator/categories/media:
    get:
      operationId: listToursOperatorPublicCategoryCovers
      summary: Approved category covers only, with requested alt or English fallback
