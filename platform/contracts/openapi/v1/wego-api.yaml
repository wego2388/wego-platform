            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/UnauthenticatedResponse" }
        "403": { $ref: "#/components/responses/ForbiddenResponse" }
        "404": { description: Asset or requested variant absent. }
  /media/{type}/{ref}/{filename}:
    get:
      operationId: getToursOperatorManagedMediaBytes
      summary: Rights-gated exact linked image; inactive tours and drafts return 404
      tags: [ToursOperator]
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [tours, categories] }
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: v
          in: query
          schema: { type: string, enum: [base, w360, w768, w1024, w1440], default: base }
