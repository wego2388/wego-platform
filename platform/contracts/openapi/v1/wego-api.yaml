      operationId: updateToursOperatorSalesControl
      summary: Pause or resume new online bookings and payment checkouts
      description: >-
        Requires tours-operator.tour:manage. Webhooks, booking expiry and
        staff operations keep running while paused.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToursOperatorSalesControlRequest"
      responses:
        "200":
          description: Switch saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorSalesControl"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/staff/notifications:
    get:
      operationId: listToursOperatorNotifications
      summary: Customer notification delivery status for staff
      description: >
        Newest first. Carries the booking reference but never the recipient
        address or message body.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ToursOperatorNotificationStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorNotification"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/staff/notifications/{id}/resend:
    post:
      operationId: resendToursOperatorNotification
      summary: Queue a customer notification again
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Queued for delivery.
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Notification not found.
        "409":
          description: The message is no longer true for the booking (booking_state_changed).
  /api/v1/tours-operator/staff/payments:
    get:
      operationId: listToursOperatorPaymentLedger
      summary: List payment ledger activity for staff finance views
      description: >
        Returns immutable payment records when any lifecycle event occurred in
        the requested Cairo-local date range. Revenue must be derived from
        ledger events, never from booking status: a sale on
        revenueRecognisedAt and its refund on refundedAt. A capture without
        revenueRecognisedAt (held for review) is never revenue, even after a
        refund. Keyset-paged by paymentId ascending; pass the last paymentId
        of the previous page as `after`.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ToursOperatorPaymentStatus"
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Payment ledger activity visible to authorized staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorPaymentLedgerEntry"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/payments/paymob-callback:
    post:
      operationId: handleToursOperatorPaymobCallback
      summary: Paymob transaction webhook (internal)
      description: >
        HMAC-SHA512 verified Paymob callback. Returns 200 for all recognised
        outcomes (idempotent). Invalid signatures return 400.
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: hmac
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Processed (or already processed).
        "400":
          description: Invalid signature or malformed payload.
        "422":
          description: Amount mismatch.
        "503":
          description: Provider intentionally unavailable; retryable, not acknowledged as processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
