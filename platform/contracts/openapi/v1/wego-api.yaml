          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
  /api/v1/tours-operator/bookings/{id}/history:
    get:
      operationId: getToursOperatorBookingHistory
      summary: Booking lifecycle history for staff
      description: >
        Append-only lifecycle events oldest first: who changed the booking,
        when, and why. actorEmail is null for system or customer actions.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
