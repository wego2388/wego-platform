        - amount
      properties:
        accountId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/JournalLineDirection"
        amount:
          type: string
          pattern: "^\\d{1,10}\\.\\d{2}$"
          description: Decimal string with exactly 2 places, e.g. "250.00" — never a raw JSON number, same reasoning as Money.
    PostJournalEntryRequest:
      type: object
      additionalProperties: false
      required:
        - entryDate
        - description
        - currencyCode
        - lines
      properties:
        entryDate:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 1000
        reference:
          type: string
          maxLength: 200
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineInput"
