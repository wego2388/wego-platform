                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Tour or media item not found.
        "409":
          description: draft_changed — the media changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorContentErrorResponse"
  /api/v1/tours-operator/staff/tours/{tourId}/media/upload:
    post:
      operationId: uploadToursOperatorTourMedia
      summary: Upload a private draft photo; requires media upload and tour manage
      description: JPEG/PNG only, at most 10 MiB and 24 million pixels. Server re-encodes without metadata. Appends up to 30 photos or replaces a mediaId only with its current reviewed revision. Never approves rights.
      tags: [ToursOperator]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tourId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ToursOperatorMediaUploadRequest"
      responses:
        "200": { $ref: "#/components/responses/ToursOperatorMediaUploaded" }
        "400": { $ref: "#/components/responses/ToursOperatorMediaInvalid" }
        "401": { $ref: "#/components/responses/UnauthenticatedResponse" }
        "403": { $ref: "#/components/responses/ForbiddenResponse" }
        "404": { description: Tour or replacement media not found. }
        "409": { description: draft_changed; re-read before retrying. }
        "413": { description: Upload exceeds byte or multipart request limit. }
        "503": { description: storage_failed or upload_busy (Retry-After 3); do not blindly retry an append. }
  /api/v1/tours-operator/staff/categories/{category}/media/upload:
    post:
