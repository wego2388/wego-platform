          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/sales-status:
    get:
      operationId: getToursOperatorSalesStatus
      summary: Whether online booking and payment are open
      description: >-
        Public. Deployment capability and effective flags only — never the
        staff note or who changed it. Enquiry mode always closes both flags;
        paused payments also close new bookings so there are no unpayable holds.
      tags:
        - ToursOperator
      security: []
      responses:
        "200":
          description: Current public sales status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorPublicSalesStatus"
  /api/v1/tours-operator/staff/sales-control:
    get:
      operationId: getToursOperatorSalesControl
      summary: Emergency sales control for managers
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current switch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorSalesControl"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
