    post: {"operationId": "countToursOperatorCashDay", "summary": "Count the cash box", "description": "Requires tours-operator.cash-box:close (reception). Records counted, expected and the difference; a recount is allowed until the day is closed.", "tags": ["ToursOperator"], "security": [{"bearerAuth": []}], "parameters": [{"name": "date", "in": "path", "required": true, "schema": {"type": "string", "format": "date"}}, {"name": "currency", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ToursOperatorPaidCurrency"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorCashCountRequest"}}}}, "responses": {"201": {"description": "Counted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorCashDay"}}}}, "409": {"description": "cash_day_closed.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorFinanceError"}}}}, "422": {"description": "cash_day_in_future.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorFinanceError"}}}}, "400": {"$ref": "#/components/responses/ToursOperatorValidationResponse"}, "401": {"$ref": "#/components/responses/UnauthenticatedResponse"}, "403": {"$ref": "#/components/responses/ForbiddenResponse"}}}
