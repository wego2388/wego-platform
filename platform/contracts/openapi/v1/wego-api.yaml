  /api/v1/tours-operator/staff/cash-box/recent:
    get: {"operationId": "listToursOperatorCashDays", "summary": "Latest state of recent cash-box days", "description": "Requires tours-operator.cash-box:close, cash-box:confirm or payment:view. The latest event per day and currency.", "tags": ["ToursOperator"], "security": [{"bearerAuth": []}], "parameters": [{"name": "days", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 92}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/ToursOperatorCashBoxEvent"}}}}}, "400": {"$ref": "#/components/responses/ToursOperatorValidationResponse"}, "401": {"$ref": "#/components/responses/UnauthenticatedResponse"}, "403": {"$ref": "#/components/responses/ForbiddenResponse"}}}
