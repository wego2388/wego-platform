  /api/v1/tours-operator/staff/bookings/{bookingId}/payment-history:
    get:
      operationId: getToursOperatorPaymentHistory
      summary: Payment status history for one booking
      description: >
        Every payment status change oldest first. recorded=false marks steps
        reconstructed from pre-history state (V21 backfill).
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment history, oldest first; empty when never paid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorPaymentHistoryEntry"
