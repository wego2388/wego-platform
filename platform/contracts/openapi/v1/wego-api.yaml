          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking history, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorBookingHistoryEntry"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
  /api/v1/tours-operator/bookings/{id}/cancel:
    post:
      operationId: cancelToursOperatorBooking
      summary: Cancel a booking
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelToursOperatorBookingRequest"
      responses:
        "200":
          description: Cancelled booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: Booking is already cancelled or cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/complete:
    post:
      operationId: completeToursOperatorBooking
      summary: Mark a confirmed booking completed
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Completed booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: Booking cannot be completed from its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/pay:
    post:
      operationId: initiateToursOperatorPayment
      summary: Initiate Paymob payment for a NEW booking
      description: >
        Creates a PENDING payment record and a Paymob Intention. Returns a
        Unified Checkout URL hosted by Paymob. Amount is always
        taken from the server-side booking snapshot. Idempotent: if a PENDING
        payment already exists, returns the existing checkout URL.
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Already initiated — existing checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorInitiatePaymentResponse"
        "201":
          description: Payment initiated — redirect to checkoutUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorInitiatePaymentResponse"
        "404":
          description: Booking not found.
        "409":
          description: Booking not in NEW state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "502":
          description: Payment provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/payment-status:
    get:
      operationId: getToursOperatorPaymentStatus
      summary: Poll payment status after returning from Paymob checkout
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorPaymentStatusResponse"
        "404":
          description: No payment record for this booking.
  /api/v1/tours-operator/staff/bookings/{bookingId}/payment-history:
    get:
      operationId: getToursOperatorPaymentHistory
      summary: Payment status history for one booking
      description: >
        Every payment status change oldest first. recorded=false marks steps
        reconstructed from pre-history state (V21 backfill).
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment history, oldest first; empty when never paid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorPaymentHistoryEntry"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/staff/notifications:
    get:
      operationId: listToursOperatorNotifications
      summary: Customer notification delivery status for staff
      description: >
        Newest first. Carries the booking reference but never the recipient
        address or message body.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ToursOperatorNotificationStatus"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Notifications, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorNotification"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/staff/notifications/{id}/resend:
    post:
      operationId: resendToursOperatorNotification
      summary: Queue a customer notification again
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Queued for delivery.
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Notification not found.
        "409":
          description: The message is no longer true for the booking (booking_state_changed).
  /api/v1/tours-operator/staff/payments:
    get:
      operationId: listToursOperatorPaymentLedger
      summary: List payment ledger activity for staff finance views
      description: >
        Returns immutable payment records when any lifecycle event occurred in
        the requested Cairo-local date range. Revenue must be derived from
        ledger events, never from booking status: a sale on
        revenueRecognisedAt and its refund on refundedAt. A capture without
        revenueRecognisedAt (held for review) is never revenue, even after a
        refund. Keyset-paged by paymentId ascending; pass the last paymentId
        of the previous page as `after`.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ToursOperatorPaymentStatus"
        - name: after
          in: query
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Payment ledger activity visible to authorized staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorPaymentLedgerEntry"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/payments/paymob-callback:
    post:
      operationId: handleToursOperatorPaymobCallback
      summary: Paymob transaction webhook (internal)
      description: >
        HMAC-SHA512 verified Paymob callback. Returns 200 for all recognised
        outcomes (idempotent). Invalid signatures return 400.
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: hmac
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Processed (or already processed).
        "400":
          description: Invalid signature or malformed payload.
        "422":
          description: Amount mismatch.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token issued by POST /api/v1/identity/login.
  responses:
    HealthResponse:
      description: Aggregate health without component details.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    UnauthenticatedResponse:
      description: Missing, invalid, or expired session token.
      headers:
        WWW-Authenticate:
          description: Always `Bearer` — the authentication scheme this API accepts.
          schema:
            type: string
            enum:
              - Bearer
    ForbiddenResponse:
      description: Authenticated, but missing the permission this operation requires.
    RateLimitedResponse:
      description: >-
        Too many login attempts — from this network address (an edge-level
        limit) or against this email (an application-level limit that closes
        the same gap for a caller spreading attempts across many source
        addresses). Both return this identical shape.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginError"
    ToursOperatorValidationResponse:
      description: Malformed or domain-invalid tours-operator request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A caller-supplied correlation id, which must be a valid UUID.
        Echoed back on the response's `X-Correlation-Id` header and
        threaded through this request's audit and outbox records. If
        omitted or not a valid UUID, a new id is generated instead —
        malformed input never fails the request and never breaks
        traceability, it only replaces the id.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationIdResponseHeader:
      description: >-
        The correlation id that applies to this request — the caller's
        own `X-Correlation-Id`, or a newly generated one if none was
        supplied or the supplied value was rejected. The same id appears
        on this request's audit and outbox records.
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: "Opaque bearer token; send as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
    LoginError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - rate_limited
            - validation_failed
    IdentityProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - roles
        - permissions
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    StaffUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - status
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateStaffUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - roleCodes
      properties:
        email:
          type: string
        password:
          type: string
        roleCodes:
          type: array
          items:
            type: string
    StaffRole:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissions
      properties:
        code:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissionCodes
      properties:
        code:
          type: string
        description:
          type: string
        permissionCodes:
          type: array
          items:
            type: string
    PermissionCatalogEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - description
      properties:
        code:
          type: string
        description:
