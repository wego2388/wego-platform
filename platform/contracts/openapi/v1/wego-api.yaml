    AccountType:
      type: string
      enum:
        - ASSET
        - LIABILITY
        - EQUITY
        - REVENUE
        - EXPENSE
    JournalLineDirection:
      type: string
      enum:
        - DEBIT
        - CREDIT
    CreateAccountRequest:
      type: object
      additionalProperties: false
      description: >-
        `code` and `accountType` are permanent once created — changing
        either is a real structural/reporting decision, not a plain detail
        correction; see UpdateAccountRequest for what stays editable.
      required:
        - code
        - name
        - accountType
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 200
        accountType:
          $ref: "#/components/schemas/AccountType"
        parentAccountId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 2000
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    AccountResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - accountType
        - normalBalance
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        normalBalance:
          $ref: "#/components/schemas/JournalLineDirection"
        parentAccountId:
          type: string
          format: uuid
        description:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - code_already_in_use
            - parent_account_not_found
            - already_inactive
            - already_active
    JournalLineInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - direction
        - amount
      properties:
        accountId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/JournalLineDirection"
        amount:
          type: string
          pattern: "^\\d{1,10}\\.\\d{2}$"
          description: Decimal string with exactly 2 places, e.g. "250.00" — never a raw JSON number, same reasoning as Money.
    PostJournalEntryRequest:
      type: object
      additionalProperties: false
      required:
        - entryDate
        - description
        - currencyCode
        - lines
      properties:
        entryDate:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 1000
        reference:
          type: string
          maxLength: 200
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineInput"
    ReverseJournalEntryRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    JournalLineResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - accountId
        - direction
        - amount
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/JournalLineDirection"
        amount:
          type: string
    JournalEntryResponse:
      type: object
      additionalProperties: false
      description: >-
        Permanent once posted — there is deliberately no edit or delete
        endpoint. `reversalOfEntryId` is set only on a reversal entry,
        pointing at the entry it corrects.
      required:
        - id
        - entryDate
        - description
        - currencyCode
        - lines
        - debitTotal
        - creditTotal
        - postedAt
      properties:
        id:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        description:
          type: string
        reference:
          type: string
        currencyCode:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLineResponse"
        debitTotal:
          type: string
        creditTotal:
          type: string
        reversalOfEntryId:
          type: string
          format: uuid
        postedByUserId:
          type: string
          format: uuid
        postedAt:
          type: string
          format: date-time
    JournalEntryErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - too_few_lines
            - missing_debit_or_credit
            - unbalanced
            - account_not_found
            - account_inactive
            - already_reversed
    PayrollRunStatus:
      type: string
      enum:
        - DRAFT
        - POSTED
    CreatePayrollRunRequest:
      type: object
      additionalProperties: false
      required:
        - payPeriodStart
        - payPeriodEnd
      properties:
        payPeriodStart:
          type: string
          format: date
        payPeriodEnd:
          type: string
          format: date
    PayrollLineResponse:
      type: object
      additionalProperties: false
      required:
        - employeeId
        - amount
      properties:
        employeeId:
          type: string
          format: uuid
        amount:
          type: string
    PayrollRunResponse:
      type: object
      additionalProperties: false
      description: >-
        A DRAFT run has no ledger consequence — it can be discarded
        freely. Posting is permanent: journalEntryId is set only once, and
        the run is never editable again afterward.
      required:
        - id
        - payPeriodStart
        - payPeriodEnd
        - currencyCode
        - totalAmount
        - status
        - lines
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        payPeriodStart:
          type: string
          format: date
        payPeriodEnd:
          type: string
          format: date
        currencyCode:
          type: string
        totalAmount:
          type: string
        status:
          $ref: "#/components/schemas/PayrollRunStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollLineResponse"
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        postedByUserId:
          type: string
          format: uuid
        postedAt:
          type: string
          format: date-time
        journalEntryId:
          type: string
          format: uuid
    PayrollErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - no_eligible_employees
            - mixed_currencies
            - overlaps_existing_run
            - not_draft
            - salaries_expense_account_not_found
            - salaries_expense_account_inactive
            - wages_payable_account_not_found
            - wages_payable_account_inactive
    TrialBalanceLineResponse:
      type: object
      additionalProperties: false
      description: >-
        `debitBalance`/`creditBalance` are mutually exclusive — an
        account's real net balance shows in exactly one column,
        whichever side it actually sits on, not necessarily its normal
        side.
      required:
        - accountId
        - code
        - name
        - accountType
        - debitBalance
        - creditBalance
      properties:
        accountId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        accountType:
          $ref: "#/components/schemas/AccountType"
        debitBalance:
          type: string
        creditBalance:
          type: string
    TrialBalanceResponse:
      type: object
      additionalProperties: false
      required:
        - asOfDate
        - lines
        - totalDebits
        - totalCredits
      properties:
        asOfDate:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TrialBalanceLineResponse"
        totalDebits:
          type: string
        totalCredits:
          type: string
    IncomeStatementLineResponse:
      type: object
      additionalProperties: false
      required:
        - accountId
