    CreateBookingRequest:
      type: object
      additionalProperties: false
      description: >-
        At least one of `customerEmail`/`customerPhone` must be present and
        non-blank — a value that is blank or all-whitespace does not count
        as present, even if the property itself is included. The schema and
        `CustomerContact` domain invariant both enforce this rule.
      required:
        - offeringId
        - partySize
        - customerName
      anyOf:
        - required:
            - customerEmail
        - required:
            - customerPhone
      properties:
        offeringId:
          type: string
          format: uuid
        partySize:
          type: integer
          minimum: 1
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerEmail:
          type: string
          format: email
          minLength: 1
          maxLength: 320
          pattern: "\\S"
        customerPhone:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "\\S"
    BookingResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - offeringId
        - partySize
        - customerName
        - status
        - paymentStatus
        - pricingBasis
        - unitPrice
        - billableQuantity
        - totalPrice
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        offeringId:
          type: string
          format: uuid
        partySize:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        pricingBasis:
          $ref: "#/components/schemas/PricingBasis"
        unitPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            The per-unit price snapshotted from the offering at the time
            this booking was created — unaffected by any later change to
            the offering's own price.
        billableQuantity:
          type: integer
          description: >-
            `partySize` when `pricingBasis` is `PER_PARTICIPANT`, always
            `1` when `pricingBasis` is `FLAT`.
        totalPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "`unitPrice.amount * billableQuantity`, snapshotted at creation time."
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
    CancelBookingRequest:
      type: object
      additionalProperties: false
      required:
        - reason
