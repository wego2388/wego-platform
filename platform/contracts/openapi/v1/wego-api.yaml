openapi: 3.1.1
info:
  title: Wego API
  version: 1.0.0
  description: >-
    Version 1 of the product-neutral Wego HTTP contract. WEGO-001 adds the
    first authenticated operations (login, logout, current identity);
    WEGO-002 adds the first business-domain operations (diving offerings and
    staff-created bookings).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current client instance
tags:
  - name: Operations
    description: Instance health endpoints with no business-data access.
  - name: Identity
    description: Authentication and the current session's identity.
  - name: Divers
    description: Diving offerings and staff-created bookings (trips, courses, equipment rental, packages).
  - name: DiverProfiles
    description: >-
      Real diver profiles — certifications, dive-history summary,
      medical/emergency contact, equipment sizing. Staff-managed records
      only; never an automated risk score or a dive-safety decision.
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Read aggregate instance health
      description: Returns only aggregate health because component details are disabled.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Read application liveness
      description: Indicates whether the application process can continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Read application readiness
      description: Indicates whether the instance can accept traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /api/v1/identity/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: >-
        Issues a bearer session token on success. The failure response is
        identical regardless of whether the email is unregistered, the
        account is locked or disabled, or the password is wrong, so a caller
        cannot enumerate registered emails from this endpoint alone.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; a new session was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed JSON body or an unrecognized property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "401":
          description: >-
            Invalid credentials. Distinct from the other endpoints'
            `UnauthenticatedResponse`: this is a rejected login attempt, not
            a missing/invalid session, so it carries no `WWW-Authenticate`
            challenge header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
  /api/v1/identity/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/identity/me:
    get:
      operationId: getCurrentIdentity
      summary: Read the current session's identity
      description: The authenticated user's id, email, assigned roles, and resolved permissions.
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProfile"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/divers/offerings:
    post:
      operationId: createOffering
      summary: Create a bookable diving offering
      description: >-
        A manually created, already-dated instance (trip, course, rental
        window, or package) — not a recurring template. Requires
        `pricingBasis`; the offering's price is `PER_PARTICIPANT` (multiplied
        by a booking's party size) or `FLAT` (a single total regardless of
        party size).
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferingRequest"
      responses:
        "201":
          description: Offering created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an out-of-range
            value, or an unrecognized JSON property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listOfferings
      summary: List diving offerings
      description: >-
        Paginated with `page`/`size`; use `Link`-free explicit
        previous/next paging on the client by incrementing `page` — the
        response never silently truncates past `size` without a way to
        reach the rest.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching offerings, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: An invalid `page`/`size`/`type`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/offerings/{id}:
    get:
      operationId: getOffering
      summary: Read a single offering
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The offering.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
  /api/v1/divers/offerings/{id}/close:
    post:
      operationId: closeOffering
      summary: Close an offering to further bookings
      description: >-
        Terminal — closing is not reversible in this packet. Row-locked
        against a concurrent `createBooking` on the same offering, so a
        close and an in-flight booking attempt against the same offering
        resolve deterministically under real concurrency, never a race.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOfferingRequest"
      responses:
        "200":
          description: The offering was closed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
        "409":
          description: The offering is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
  /api/v1/divers/divers:
    post:
      operationId: createDiver
      summary: Create a diver profile
      description: >-
        Requires `diver:manage`. At least one of `email`/`phone` must be
        present and non-blank.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "201":
          description: Diver profile created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an
            out-of-range value, or a diver with neither email nor phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listDivers
      summary: List diver profiles
      description: >-
        Requires `diver:view`. Paginated with `page`/`size`; `search`
        matches against the diver's full name.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DiverStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching diver profiles, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiverResponse"
        "400":
          description: An invalid `page`/`size`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/divers/{id}:
    get:
      operationId: getDiver
      summary: Read a single diver profile
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The diver profile.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
    put:
      operationId: updateDiver
      summary: Replace a diver profile's editable fields
      description: >-
        Requires `diver:manage`. A full replace of every editable field,
        including the certification list — this is not a partial patch.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "200":
          description: Diver profile updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
        "409":
          description: The diver profile is archived and cannot be edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverErrorResponse"
    delete:
      operationId: archiveDiver
      summary: Archive a diver profile
      description: >-
        Requires `diver:manage`. Archiving is a soft, terminal state change
        — the record is never deleted.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Diver profile archived.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
        "409":
          description: The diver profile is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverErrorResponse"
  /api/v1/divers/bookings:
    post:
      operationId: createBooking
      summary: Create a booking against a dated offering
      description: >-
        Confirms immediately — there is no pending state. Capacity is
        enforced under real concurrency via a row lock on the offering.
        Idempotency is enforced by a canonical fingerprint of
        (offeringId, partySize, normalized customer contact): the same
        actor replaying the same `Idempotency-Key` with the same
        fingerprint returns the original booking unchanged (200); the same
        actor reusing the key with a *different* fingerprint — a different
        offering, party size, or customer — is rejected as
        `idempotency_key_conflict` (409), never silently applied and never
        a raw unique-constraint 500.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: A new booking was created and confirmed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "200":
          description: >-
            Idempotent replay — a booking already exists for this actor's
            Idempotency-Key with an identical request fingerprint, returned
            unchanged.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an
            out-of-range value, or an unrecognized JSON property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
        "409":
          description: >-
            The offering is closed, its capacity is already reached, or
            this Idempotency-Key was already used for a different request
            fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
    get:
      operationId: listBookings
      summary: List bookings
      description: >-
        Paginated with `page`/`size` — never silently hides bookings past
        the first page; callers must page through `page` to see the rest.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: offeringId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching bookings, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResponse"
        "400":
          description: An invalid `page`/`size`/`offeringId`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/bookings/{id}:
    get:
      operationId: getBooking
      summary: Read a single booking
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The booking.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No booking with this id.
  /api/v1/divers/bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a confirmed booking
      description: >-
        Terminal — cancel only succeeds from CONFIRMED. Requires a
        non-blank `reason`. Independent of payment status: a paid booking
        that gets cancelled is not automatically refunded — refund is a
        separate, separately permissioned action.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: The booking was cancelled.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: A blank or oversized `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No booking with this id.
        "409":
          description: The booking is already cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
  /api/v1/divers/bookings/{id}/mark-paid:
    patch:
      operationId: markBookingPaid
      summary: Mark a booking's payment as received
      description: >-
        `UNPAID -> PAID` only. Requires `booking:payment-update` — a
        distinct permission from `booking:create`; a user who can create
        bookings cannot mark them paid unless separately granted this
        permission. Repeating the same call on an already-`PAID` booking is
        a documented no-op (200, no duplicate audit/outbox write), not an
        error.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment recorded (or already recorded — idempotent).
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No booking with this id.
        "409":
          description: The booking is CANCELLED or REFUNDED, so payment cannot be marked received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
  /api/v1/divers/bookings/{id}/refund:
    patch:
      operationId: refundBooking
      summary: Refund a paid booking
      description: >-
        `PAID -> REFUNDED` only, and only with a non-blank `reason`.
        Requires `booking:refund` — a distinct permission from both
        `booking:create` and `booking:payment-update`, treated as the more
        sensitive of the two payment actions. Refunding an UNPAID booking
        is rejected, not applied. A cancelled booking may still be
        refunded if it was PAID before cancellation.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundBookingRequest"
      responses:
        "200":
          description: Refund recorded (or already recorded — idempotent).
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: A blank or oversized `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No booking with this id.
        "409":
          description: The booking is UNPAID — there is nothing to refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token issued by POST /api/v1/identity/login.
  responses:
    HealthResponse:
      description: Aggregate health without component details.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    UnauthenticatedResponse:
      description: Missing, invalid, or expired session token.
      headers:
        WWW-Authenticate:
          description: Always `Bearer` — the authentication scheme this API accepts.
          schema:
            type: string
            enum:
              - Bearer
    ForbiddenResponse:
      description: Authenticated, but missing the permission this operation requires.
    RateLimitedResponse:
      description: >-
        Too many login attempts — from this network address (an edge-level
        limit) or against this email (an application-level limit that closes
        the same gap for a caller spreading attempts across many source
        addresses). Both return this identical shape.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginError"
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A caller-supplied correlation id, which must be a valid UUID.
        Echoed back on the response's `X-Correlation-Id` header and
        threaded through this request's audit and outbox records. If
        omitted or not a valid UUID, a new id is generated instead —
        malformed input never fails the request and never breaks
        traceability, it only replaces the id.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationIdResponseHeader:
      description: >-
        The correlation id that applies to this request — the caller's
        own `X-Correlation-Id`, or a newly generated one if none was
        supplied or the supplied value was rejected. The same id appears
        on this request's audit and outbox records.
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: "Opaque bearer token; send as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
    LoginError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - rate_limited
            - validation_failed
    IdentityProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - roles
        - permissions
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    OfferingType:
      type: string
      enum:
        - DIVE_TRIP
        - COURSE
        - EQUIPMENT_RENTAL
        - PACKAGE
    OfferingStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
    BookingStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
    PaymentStatus:
      type: string
      enum:
        - UNPAID
        - PAID
        - REFUNDED
    PricingBasis:
      type: string
      description: >-
        How an offering's `unitPrice` combines with a booking's party size
        to produce the booking's total. `PER_PARTICIPANT` multiplies
        `unitPrice` by `partySize`; `FLAT` charges `unitPrice` once
        regardless of party size (e.g. a whole-boat charter or a
        flat-rate equipment rental).
      enum:
        - PER_PARTICIPANT
        - FLAT
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: string
          pattern: "^\\d{1,8}\\.\\d{2}$"
          description: >-
            Decimal string with exactly 2 places, e.g. "45.00" — never a
            binary float, never a different scale.
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
    CreateOfferingRequest:
      type: object
      additionalProperties: false
      required:
        - offeringType
        - title
        - startsOn
        - pricingBasis
        - unitPrice
      properties:
        offeringType:
          $ref: "#/components/schemas/OfferingType"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 1
        pricingBasis:
          $ref: "#/components/schemas/PricingBasis"
        unitPrice:
          $ref: "#/components/schemas/Money"
    OfferingResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - offeringType
        - title
        - startsOn
        - pricingBasis
        - unitPrice
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        offeringType:
          $ref: "#/components/schemas/OfferingType"
        title:
          type: string
        description:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        capacity:
          type: integer
        pricingBasis:
          $ref: "#/components/schemas/PricingBasis"
        unitPrice:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/OfferingStatus"
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    CloseOfferingRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
    DiverStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    DiverCertification:
      type: object
      additionalProperties: false
      required:
        - agency
        - level
      properties:
        id:
          type: string
          format: uuid
        agency:
          type: string
          minLength: 1
          maxLength: 200
        level:
          type: string
          minLength: 1
          maxLength: 200
        certificationNumber:
          type: string
          maxLength: 64
        issuedOn:
          type: string
          format: date
    UpsertDiverRequest:
      type: object
      additionalProperties: false
      description: >-
        At least one of `email`/`phone` must be present and non-blank. A
        full replace on `PUT` — omitting a field clears it, including the
        certification list.
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        nationality:
          type: string
          maxLength: 100
        primaryLanguage:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 32
        emergencyContactName:
          type: string
          maxLength: 200
        emergencyContactPhone:
          type: string
          maxLength: 32
        medicalNotes:
          type: string
          maxLength: 4000
          description: Staff reference only — never a dive-fitness clearance decision.
        totalLoggedDives:
          type: integer
          minimum: 0
          default: 0
        maxDepthMeters:
          type: number
          minimum: 0
        lastDiveOn:
          type: string
          format: date
        bcdSize:
          type: string
          maxLength: 16
        finSize:
          type: string
          maxLength: 16
        wetsuitSize:
          type: string
          maxLength: 16
        certifications:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/DiverCertification"
    DiverResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
        - totalLoggedDives
        - certifications
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        nationality:
          type: string
        primaryLanguage:
          type: string
        email:
          type: string
        phone:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        medicalNotes:
          type: string
        totalLoggedDives:
          type: integer
        maxDepthMeters:
          type: number
        lastDiveOn:
          type: string
          format: date
        bcdSize:
          type: string
        finSize:
          type: string
        wetsuitSize:
          type: string
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/DiverCertification"
        status:
          $ref: "#/components/schemas/DiverStatus"
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
    DiverErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
    CreateBookingRequest:
      type: object
      additionalProperties: false
      description: >-
        At least one of `customerEmail`/`customerPhone` must be present and
        non-blank — a value that is blank or all-whitespace does not count
        as present, even if the property itself is included. The schema and
        `CustomerContact` domain invariant both enforce this rule.
      required:
        - offeringId
        - partySize
        - customerName
      anyOf:
        - required:
            - customerEmail
        - required:
            - customerPhone
      properties:
        offeringId:
          type: string
          format: uuid
        partySize:
          type: integer
          minimum: 1
        customerName:
          type: string
          minLength: 1
          maxLength: 200
        customerEmail:
          type: string
          format: email
          minLength: 1
          maxLength: 320
          pattern: "\\S"
        customerPhone:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "\\S"
    BookingResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - offeringId
        - partySize
        - customerName
        - status
        - paymentStatus
        - pricingBasis
        - unitPrice
        - billableQuantity
        - totalPrice
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        offeringId:
          type: string
          format: uuid
        partySize:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        pricingBasis:
          $ref: "#/components/schemas/PricingBasis"
        unitPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            The per-unit price snapshotted from the offering at the time
            this booking was created — unaffected by any later change to
            the offering's own price.
        billableQuantity:
          type: integer
          description: >-
            `partySize` when `pricingBasis` is `PER_PARTICIPANT`, always
            `1` when `pricingBasis` is `FLAT`.
        totalPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "`unitPrice.amount * billableQuantity`, snapshotted at creation time."
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
    CancelBookingRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    RefundBookingRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - validation_failed
        message:
          type: string
          description: A safe, human-readable description of which rule failed.
    BookingError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - offering_closed
            - already_closed
            - capacity_exceeded
            - already_cancelled
            - invalid_payment_transition
            - idempotency_key_conflict
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
