openapi: 3.1.1
info:
  title: Wego API
  version: 1.0.0
  description: >-
    Version 1 of the product-neutral Wego HTTP contract. WEGO-001 adds the
    first authenticated operations (login, logout, current identity);
    WEGO-002 adds the first business-domain operations (diving offerings and
    staff-created bookings).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current client instance
tags:
  - name: Operations
    description: Instance health endpoints with no business-data access.
  - name: Identity
    description: Authentication and the current session's identity.
  - name: Divers
    description: Diving offerings and staff-created bookings (trips, courses, equipment rental, packages).
  - name: DiverProfiles
    description: >-
      Real diver profiles — certifications, dive-history summary,
      medical/emergency contact, equipment sizing. Staff-managed records
      only; never an automated risk score or a dive-safety decision.
  - name: Equipment
    description: >-
      QR-coded equipment and tanks with a maintenance log and rental
      history. No RFID, no fleet telemetry — a real, staff-scanned
      registry sized for one dive center's actual inventory.
  - name: BoatCharters
    description: >-
      Real charter agreements for chartered boats (this business charters
      boats, it does not own a fleet). The one safety rule this registry
      exists for: a boat-diving offering can never claim more seats than
      the boat's real licensed passenger capacity.
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Read aggregate instance health
      description: Returns only aggregate health because component details are disabled.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Read application liveness
      description: Indicates whether the application process can continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Read application readiness
      description: Indicates whether the instance can accept traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /api/v1/identity/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: >-
        Issues a bearer session token on success. The failure response is
        identical regardless of whether the email is unregistered, the
        account is locked or disabled, or the password is wrong, so a caller
        cannot enumerate registered emails from this endpoint alone.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; a new session was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed JSON body or an unrecognized property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "401":
          description: >-
            Invalid credentials. Distinct from the other endpoints'
            `UnauthenticatedResponse`: this is a rejected login attempt, not
            a missing/invalid session, so it carries no `WWW-Authenticate`
            challenge header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
  /api/v1/identity/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/identity/me:
    get:
      operationId: getCurrentIdentity
      summary: Read the current session's identity
      description: The authenticated user's id, email, assigned roles, and resolved permissions.
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProfile"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/divers/offerings:
    post:
      operationId: createOffering
      summary: Create a bookable diving offering
      description: >-
        A manually created, already-dated instance (trip, course, rental
        window, or package) — not a recurring template. Requires
        `pricingBasis`; the offering's price is `PER_PARTICIPANT` (multiplied
        by a booking's party size) or `FLAT` (a single total regardless of
        party size).
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferingRequest"
      responses:
        "201":
          description: Offering created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an out-of-range
            value, or an unrecognized JSON property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listOfferings
      summary: List diving offerings
      description: >-
        Paginated with `page`/`size`; use `Link`-free explicit
        previous/next paging on the client by incrementing `page` — the
        response never silently truncates past `size` without a way to
        reach the rest.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching offerings, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: An invalid `page`/`size`/`type`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/offerings/{id}:
    get:
      operationId: getOffering
      summary: Read a single offering
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The offering.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
  /api/v1/divers/offerings/{id}/close:
    post:
      operationId: closeOffering
      summary: Close an offering to further bookings
      description: >-
        Terminal — closing is not reversible in this packet. Row-locked
        against a concurrent `createBooking` on the same offering, so a
        close and an in-flight booking attempt against the same offering
        resolve deterministically under real concurrency, never a race.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOfferingRequest"
      responses:
        "200":
          description: The offering was closed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
        "409":
          description: The offering is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
  /api/v1/divers/divers:
    post:
      operationId: createDiver
      summary: Create a diver profile
      description: >-
        Requires `diver:manage`. At least one of `email`/`phone` must be
        present and non-blank.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "201":
          description: Diver profile created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an
            out-of-range value, or a diver with neither email nor phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listDivers
      summary: List diver profiles
      description: >-
        Requires `diver:view`. Paginated with `page`/`size`; `search`
        matches against the diver's full name.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DiverStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching diver profiles, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiverResponse"
        "400":
          description: An invalid `page`/`size`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/divers/{id}:
    get:
      operationId: getDiver
      summary: Read a single diver profile
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The diver profile.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
    put:
      operationId: updateDiver
      summary: Replace a diver profile's editable fields
      description: >-
        Requires `diver:manage`. A full replace of every editable field,
        including the certification list — this is not a partial patch.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "200":
          description: Diver profile updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
        "409":
          description: The diver profile is archived and cannot be edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverErrorResponse"
    delete:
      operationId: archiveDiver
      summary: Archive a diver profile
      description: >-
        Requires `diver:manage`. Archiving is a soft, terminal state change
        — the record is never deleted.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Diver profile archived.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
        "409":
          description: The diver profile is already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverErrorResponse"
  /api/v1/divers/equipment:
    post:
      operationId: createEquipment
      summary: Register a new piece of equipment or a tank
      description: Requires `equipment:manage`. `qrCode` must be unique.
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentRequest"
      responses:
        "201":
          description: Equipment created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          description: Another item already uses this QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentErrorResponse"
    get:
      operationId: listEquipment
      summary: List equipment and tanks
      description: >-
        Requires `equipment:view`. Paginated with `page`/`size`; `search`
        fuzzy-matches label, QR code, or serial number. `qrCode` is a
        separate exact match for a real scanned code — QR codes are unique,
        so this bypasses pagination and every other filter and returns at
        most one item, or an empty array if nothing has that code.
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: qrCode
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching equipment, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/equipment/{id}:
    get:
      operationId: getEquipment
      summary: Read a single piece of equipment
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The equipment.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No equipment with this id.
    put:
      operationId: updateEquipment
      summary: Edit an equipment item's descriptive fields
      description: >-
        Requires `equipment:manage`. Label, size, and serial number only —
        the QR code and lifecycle status are never changed here.
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentRequest"
      responses:
        "200":
          description: Equipment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No equipment with this id.
  /api/v1/divers/equipment/{id}/start-maintenance:
    post:
      operationId: startEquipmentMaintenance
      summary: Move an active item into maintenance
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Equipment is now in maintenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No equipment with this id.
        "409":
          description: The item is not currently active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentErrorResponse"
  /api/v1/divers/equipment/{id}/complete-maintenance:
    post:
      operationId: completeEquipmentMaintenance
      summary: Return an item from maintenance to active
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Equipment is active again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No equipment with this id.
        "409":
          description: The item is not currently in maintenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentErrorResponse"
  /api/v1/divers/equipment/{id}/retire:
    post:
      operationId: retireEquipment
      summary: Permanently retire an item
      description: >-
        Requires `equipment:manage`. Terminal. Rejected if the item
        currently has an open rental.
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Equipment retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No equipment with this id.
        "409":
          description: Already retired, or currently out on an open rental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentErrorResponse"
  /api/v1/divers/equipment/{id}/service-records:
    get:
      operationId: listServiceRecords
      summary: List an item's maintenance log
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Service records, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecordResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    post:
      operationId: addServiceRecord
      summary: Log a maintenance event
      description: Requires `equipment:manage`. Append-only — a record is never edited or removed.
      tags:
        - Equipment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
