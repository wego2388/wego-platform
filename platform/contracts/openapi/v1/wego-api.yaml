openapi: 3.1.1
info:
  title: Wego API
  version: 1.0.0
  description: >-
    Version 1 of the product-neutral Wego HTTP contract. WEGO-001 adds the
    first authenticated operations (login, logout, current identity);
    WEGO-002 adds the first business-domain operations (diving offerings and
    staff-created bookings).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Current client instance
tags:
  - name: Operations
    description: Instance health endpoints with no business-data access.
  - name: Identity
    description: Authentication and the current session's identity.
  - name: Divers
    description: Diving offerings and staff-created bookings (trips, courses, equipment rental, packages).
  - name: DiverProfiles
    description: >-
      Real diver profiles — certifications, dive-history summary,
      medical/emergency contact, equipment sizing. Staff-managed records
      only; never an automated risk score or a dive-safety decision.
  - name: Equipment
    description: >-
      QR-coded equipment and tanks with a maintenance log and rental
      history. No RFID, no fleet telemetry — a real, staff-scanned
      registry sized for one dive center's actual inventory.
  - name: BoatCharters
    description: >-
      Real charter agreements for chartered boats (this business charters
      boats, it does not own a fleet). The one safety rule this registry
      exists for: a boat-diving offering can never claim more seats than
      the boat's real licensed passenger capacity.
  - name: CourseEnrollments
    description: >-
      A real diver's progress through a real COURSE offering: Lead ->
      Theory -> Pool -> Open Water -> Certified, forward-only, or
      Withdrawn from any non-finished stage. Instructor assignment and a
      real append-only skill-evaluation log.
  - name: Dashboard
    description: >-
      Real business KPIs for a super-admin/operations dashboard. One
      endpoint per existing module's own view permission — a caller only
      ever sees the sections their real role already grants them,
      enforced server-side.
  - name: HumanResources
    description: >-
      Real employee records — position, department, hire date, contact
      details, base salary, and an optional link to a staff login account.
      Termination is a terminal, staff-managed status change; a rehire
      gets a brand-new record. Also covers day-by-day attendance (an
      upsert per employee per date) and a real leave-request approval
      workflow (PENDING -> APPROVED/REJECTED or PENDING -> CANCELLED),
      both staff-recorded on an employee's behalf, not self-service.
  - name: Accounting
    description: >-
      A real double-entry accounting system: a staff-managed chart of
      accounts (deactivated, never deleted, once referenced) and permanent
      journal entries. Every entry must balance (debits == credits, one
      shared currency) and, once posted, is never edited or deleted — a
      mistake is corrected with a real reversing entry, standard
      accounting practice.
  - name: Payroll
    description: >-
      A real payroll run: a DRAFT preview (one line per active,
      salaried employee, a snapshot of their base salary — never a live
      reference) that has no ledger consequence until explicitly posted.
      Posting creates one real, balanced journal entry against the real
      Salaries Expense / Wages Payable accounts and is permanent — the
      run itself is never edited afterward. A DRAFT can be freely
      discarded; a cash-disbursement entry, once wages are actually
      transferred, is posted separately through Accounting's own journal
      endpoint.
  - name: ToursOperator
    description: >-
      Safari Tours Sharm public catalog and booking lifecycle. Public reads
      and booking intake are explicitly unauthenticated; staff lifecycle and
      customer-list operations require namespaced tours-operator permissions.
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Read aggregate instance health
      description: Returns only aggregate health because component details are disabled.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Read application liveness
      description: Indicates whether the application process can continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Read application readiness
      description: Indicates whether the instance can accept traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthResponse"
        "503":
          $ref: "#/components/responses/HealthResponse"
  /api/v1/identity/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: >-
        Issues a bearer session token on success. The failure response is
        identical regardless of whether the email is unregistered, the
        account is locked or disabled, or the password is wrong, so a caller
        cannot enumerate registered emails from this endpoint alone.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; a new session was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Malformed JSON body or an unrecognized property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "401":
          description: >-
            Invalid credentials. Distinct from the other endpoints'
            `UnauthenticatedResponse`: this is a rejected login attempt, not
            a missing/invalid session, so it carries no `WWW-Authenticate`
            challenge header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "429":
          $ref: "#/components/responses/RateLimitedResponse"
  /api/v1/identity/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/identity/me:
    get:
      operationId: getCurrentIdentity
      summary: Read the current session's identity
      description: The authenticated user's id, email, assigned roles, and resolved permissions.
      tags:
        - Identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProfile"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
  /api/v1/identity/users:
    get:
      operationId: listStaffUsers
      summary: List staff accounts
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All staff accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    post:
      operationId: createStaffUser
      summary: Create a staff account
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffUserRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: An unknown role code was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          description: The email is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
  /api/v1/identity/users/{id}/disable:
    post:
      operationId: disableStaffUser
      summary: Disable a staff account
      description: An account cannot disable itself — see `cannot_disable_self`.
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No account with that id.
        "409":
          description: Already disabled, or the caller tried to disable their own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
  /api/v1/identity/users/{id}/enable:
    post:
      operationId: enableStaffUser
      summary: Re-enable a disabled staff account
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account re-enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No account with that id.
        "409":
          description: Already active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
  /api/v1/identity/users/{id}/reset-password:
    post:
      operationId: resetStaffUserPassword
      summary: Admin-set a staff account's password
      description: >-
        Sets the password directly — no email/token flow. The admin tells the
        new password to the employee outside the system.
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No account with that id.
  /api/v1/identity/users/{id}/roles:
    put:
      operationId: assignStaffUserRoles
      summary: Replace a staff account's roles
      description: An account cannot change its own roles — see `cannot_change_own_roles`.
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - roleCodes
              properties:
                roleCodes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Roles replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          description: An unknown role code was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No account with that id.
        "409":
          description: The caller tried to change their own roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: List roles and their permissions
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffRole"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    post:
      operationId: createRole
      summary: Create a role
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRole"
        "400":
          description: An unknown permission code was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          description: A role with that code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
  /api/v1/identity/permissions:
    get:
      operationId: listPermissions
      summary: List the full permission catalog
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every permission code the platform enforces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionCatalogEntry"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/identity/roles/{code}/permissions:
    put:
      operationId: updateRolePermissions
      summary: Replace a role's permission set
      tags:
        - Identity Administration
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - permissionCodes
              properties:
                permissionCodes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Permissions replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRole"
        "400":
          description: An unknown permission code was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAdminError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No role with that code.
  /api/v1/divers/offerings:
    post:
      operationId: createOffering
      summary: Create a bookable diving offering
      description: >-
        A manually created, already-dated instance (trip, course, rental
        window, or package) — not a recurring template. Requires
        `pricingBasis`; the offering's price is `PER_PARTICIPANT` (multiplied
        by a booking's party size) or `FLAT` (a single total regardless of
        party size).
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferingRequest"
      responses:
        "201":
          description: Offering created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an out-of-range
            value, or an unrecognized JSON property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listOfferings
      summary: List diving offerings
      description: >-
        Paginated with `page`/`size`; use `Link`-free explicit
        previous/next paging on the client by incrementing `page` — the
        response never silently truncates past `size` without a way to
        reach the rest.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfferingStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching offerings, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: An invalid `page`/`size`/`type`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/offerings/{id}:
    get:
      operationId: getOffering
      summary: Read a single offering
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The offering.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
  /api/v1/divers/offerings/{id}/close:
    post:
      operationId: closeOffering
      summary: Close an offering to further bookings
      description: >-
        Terminal — closing is not reversible in this packet. Row-locked
        against a concurrent `createBooking` on the same offering, so a
        close and an in-flight booking attempt against the same offering
        resolve deterministically under real concurrency, never a race.
      tags:
        - Divers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOfferingRequest"
      responses:
        "200":
          description: The offering was closed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No offering with this id.
        "409":
          description: The offering is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingError"
  /api/v1/divers/divers:
    post:
      operationId: createDiver
      summary: Create a diver profile
      description: >-
        Requires `diver:manage`. At least one of `email`/`phone` must be
        present and non-blank.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "201":
          description: Diver profile created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: >-
            The request failed validation — a malformed field, an
            out-of-range value, or a diver with neither email nor phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    get:
      operationId: listDivers
      summary: List diver profiles
      description: >-
        Requires `diver:view`. Paginated with `page`/`size`; `search`
        matches against the diver's full name. Returns a roster projection —
        email, phone, emergency contact, medical notes and certification
        numbers are deliberately omitted; fetch a single diver by id for the
        full record.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DiverStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching diver profiles, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiverSummaryResponse"
        "400":
          description: An invalid `page`/`size`/`status` query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/divers/divers/{id}:
    get:
      operationId: getDiver
      summary: Read a single diver profile
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The diver profile.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No diver profile with this id.
    put:
      operationId: updateDiver
      summary: Replace a diver profile's editable fields
      description: >-
        Requires `diver:manage`. A full replace of every editable field,
        including the certification list — this is not a partial patch.
      tags:
        - DiverProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDiverRequest"
      responses:
        "200":
          description: Diver profile updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiverResponse"
        "400":
          description: The request failed validation.
          content:
            application/json:
              schema:
