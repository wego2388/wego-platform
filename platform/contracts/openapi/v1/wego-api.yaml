        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/staff/fx-rate:
    post:
      operationId: setToursOperatorFxRate
      summary: Set today's EUR to EGP rate
      description: >-
        Requires tours-operator.fx-rate:manage. Append-only: a new rate for
        the day supersedes the earlier one and every rate is kept as history.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetToursOperatorFxRateRequest"
