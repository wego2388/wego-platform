          type: string
          format: date
        currencyCode:
          type: string
        totalAmount:
          type: string
        status:
          $ref: "#/components/schemas/PayrollRunStatus"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayrollLineResponse"
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        postedByUserId:
          type: string
          format: uuid
