          in: query
          required: false
          schema:
            type: string
            format: date
        - name: accountId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: reference
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
