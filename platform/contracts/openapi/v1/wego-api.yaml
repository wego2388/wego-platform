  /api/v1/tours-operator/staff/bookings/{bookingId}/refunds:
    get: {"operationId": "listToursOperatorOfficeRefunds", "summary": "Money returned on an office booking", "description": "Requires tours-operator.booking:view.", "tags": ["ToursOperator"], "security": [{"bearerAuth": []}], "parameters": [{"name": "bookingId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorOfficeRefunds"}}}}, "400": {"$ref": "#/components/responses/ToursOperatorValidationResponse"}, "401": {"$ref": "#/components/responses/UnauthenticatedResponse"}, "403": {"$ref": "#/components/responses/ForbiddenResponse"}}}
