          - type: 'null'
        vehicle:
          anyOf:
          - type: string
          - type: 'null'
    ToursOperatorCancellationFormData:
      type: object
      additionalProperties: false
      required:
      - reference
      - tourNameEn
      - tourNameAr
      - tourDate
      - timeSlot
      - customerName
      - cancelledAt
      - cancellationReason
      - collections
      - collectedNet
      - policy
      - hoursBeforeTour
      - refundPercent
      - expectedReturn
      - todayRate
      - expectedReturnEgp
      - refunds
      - refundedNet
      - remainingToReturn
      - returnState
      properties:
        reference:
          type: string
        tourNameEn:
          type: string
        tourNameAr:
          anyOf:
          - type: string
          - type: 'null'
        tourDate:
          type: string
          format: date
        timeSlot:
          $ref: '#/components/schemas/ToursOperatorTimeSlot'
        customerName:
          type: string
        cancelledAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - recordedAt
            - reversal
            - method
            - currencyPaid
            - amountPaid
            - settledEur
            properties:
              recordedAt:
                type: string
                format: date-time
              reversal:
                type: boolean
              method:
                $ref: '#/components/schemas/ToursOperatorCollectionMethod'
              currencyPaid:
                $ref: '#/components/schemas/ToursOperatorPaidCurrency'
              amountPaid:
                $ref: '#/components/schemas/Money'
              settledEur:
                $ref: '#/components/schemas/Money'
        collectedNet:
          $ref: '#/components/schemas/Money'
        policy:
          type: string
          enum:
          - STANDARD
          - FLEXIBLE
          - NON_REFUNDABLE
        hoursBeforeTour:
          type: integer
          format: int64
          description: Whole hours from cancellation to the start of the tour day (Africa/Cairo).
        refundPercent:
          type: integer
          minimum: 0
          maximum: 100
        expectedReturn:
          $ref: '#/components/schemas/Money'
