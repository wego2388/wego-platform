        "201":
          description: Employee record created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          description: >-
            The request failed field validation, or `linkedUserId` was not
            an active staff user.
          content:
            application/json:
