        ongoing accounting/audit need), unlike `Diver.archive()`.
      tags:
        - HumanResources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateEmployeeRequest"
      responses:
        "200":
          description: Employee terminated.
