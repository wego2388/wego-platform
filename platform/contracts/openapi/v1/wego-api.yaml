      description: Requires `payroll:view`. Paginated with `page`/`size`; filterable by `status`.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PayrollRunStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching payroll runs, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRunResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/payroll/runs/{id}:
    get:
      operationId: getPayrollRun
      summary: Read a single payroll run
      description: Requires `payroll:view`.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The payroll run.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
  /api/v1/payroll/runs/{id}/post:
    post:
      operationId: postPayrollRun
      summary: Post a draft payroll run
      description: >-
        Requires `payroll:manage`. Creates one real, balanced journal
        entry (DEBIT Salaries Expense, CREDIT Wages Payable, both for the
        run's total) against the real accounts seeded by V12. Permanent —
        the run is never editable again afterward.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payroll run posted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunResponse"
        "400":
          description: The required Salaries Expense or Wages Payable account is missing or inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
        "409":
          description: This run is no longer a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
  /api/v1/payroll/runs/{id}/discard:
    post:
      operationId: discardPayrollRun
      summary: Discard a draft payroll run
      description: Requires `payroll:manage`. Only a DRAFT run can be discarded — a POSTED run is permanent.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Payroll run discarded.
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
        "409":
          description: This run is no longer a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
  /api/v1/accounting/reports/trial-balance:
    get:
      operationId: getTrialBalance
      summary: The trial balance as of a date
      description: >-
        Requires `accounting:journal-view` (a read over the same ledger
        every other Accounting read is already gated by, not a new
        permission). Each account nets to whichever column it really sits
        on; `totalDebits` must equal `totalCredits` — the real, mechanical
        proof every posted entry actually balanced.
      tags:
        - Accounting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: asOfDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The trial balance.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalanceResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/accounting/reports/income-statement:
    get:
      operationId: getIncomeStatement
      summary: The income statement (profit and loss) for a period
      description: Requires `accounting:journal-view`. Revenue minus expenses within `from`..`to`, inclusive.
      tags:
        - Accounting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The income statement.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeStatementResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/accounting/reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      summary: The balance sheet as of a date
      description: >-
        Requires `accounting:journal-view`. `totalAssets` must equal
        `totalLiabilities + totalEquity` — `equityLines` includes a real,
        synthesized "Retained Earnings (accumulated)" line (`accountId`
        null on that one line only) computed on the fly, since this
        system has no formal period-closing step to zero Revenue/Expense
        into Equity — see `BalanceSheetResponse`'s own note.
      tags:
        - Accounting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: asOfDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The balance sheet.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSheetResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
