          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 1000
        reference:
          type: string
          maxLength: 200
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineInput"
