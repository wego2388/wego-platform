        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PayrollRunStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Matching payroll runs, one page.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRunResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/payroll/runs/{id}:
    get:
      operationId: getPayrollRun
      summary: Read a single payroll run
      description: Requires `payroll:view`.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The payroll run.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
  /api/v1/payroll/runs/{id}/post:
    post:
      operationId: postPayrollRun
      summary: Post a draft payroll run
      description: >-
        Requires `payroll:manage`. Creates one real, balanced journal
        entry (DEBIT Salaries Expense, CREDIT Wages Payable, both for the
        run's total) against the real accounts seeded by V12. Permanent —
        the run is never editable again afterward.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payroll run posted.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunResponse"
        "400":
          description: The required Salaries Expense or Wages Payable account is missing or inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
        "409":
          description: This run is no longer a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
  /api/v1/payroll/runs/{id}/discard:
    post:
      operationId: discardPayrollRun
      summary: Discard a draft payroll run
      description: Requires `payroll:manage`. Only a DRAFT run can be discarded — a POSTED run is permanent.
      tags:
        - Payroll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Payroll run discarded.
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: No payroll run with this id.
        "409":
          description: This run is no longer a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token issued by POST /api/v1/identity/login.
  responses:
    HealthResponse:
      description: Aggregate health without component details.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    UnauthenticatedResponse:
      description: Missing, invalid, or expired session token.
      headers:
        WWW-Authenticate:
          description: Always `Bearer` — the authentication scheme this API accepts.
          schema:
            type: string
            enum:
              - Bearer
    ForbiddenResponse:
      description: Authenticated, but missing the permission this operation requires.
    RateLimitedResponse:
      description: >-
        Too many login attempts — from this network address (an edge-level
        limit) or against this email (an application-level limit that closes
        the same gap for a caller spreading attempts across many source
        addresses). Both return this identical shape.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginError"
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A caller-supplied correlation id, which must be a valid UUID.
        Echoed back on the response's `X-Correlation-Id` header and
        threaded through this request's audit and outbox records. If
        omitted or not a valid UUID, a new id is generated instead —
        malformed input never fails the request and never breaks
        traceability, it only replaces the id.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationIdResponseHeader:
      description: >-
        The correlation id that applies to this request — the caller's
        own `X-Correlation-Id`, or a newly generated one if none was
        supplied or the supplied value was rejected. The same id appears
        on this request's audit and outbox records.
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: "Opaque bearer token; send as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
    LoginError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - rate_limited
            - validation_failed
    IdentityProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - roles
        - permissions
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    StaffUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - status
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateStaffUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - roleCodes
      properties:
        email:
          type: string
        password:
          type: string
        roleCodes:
          type: array
          items:
            type: string
    StaffRole:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissions
      properties:
        code:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissionCodes
      properties:
        code:
          type: string
        description:
          type: string
        permissionCodes:
          type: array
          items:
            type: string
    PermissionCatalogEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - description
      properties:
        code:
          type: string
        description:
          type: string
    IdentityAdminError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: >-
            One of: email_already_in_use, unknown_role:<code>,
            cannot_disable_self, already_disabled, already_active,
            cannot_change_own_roles, role_already_exists,
            unknown_permission:<code>.
    OfferingType:
      type: string
      enum:
        - DIVE_TRIP
        - COURSE
