              $ref: "#/components/headers/CorrelationIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryResponse"
        "400":
          description: >-
            The request failed field validation, fewer than 2 lines, no
            debit or no credit line, the entry doesn't balance, or a
            referenced account does not exist or is inactive.
