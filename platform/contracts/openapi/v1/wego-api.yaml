      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking history, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorBookingHistoryEntry"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
  /api/v1/tours-operator/bookings/{id}/cancel:
    post:
      operationId: cancelToursOperatorBooking
      summary: Cancel a booking
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelToursOperatorBookingRequest"
      responses:
        "200":
          description: Cancelled booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: Booking is already cancelled or cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/complete:
    post:
      operationId: completeToursOperatorBooking
      summary: Mark a confirmed booking completed
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Completed booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: Booking cannot be completed from its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/pay:
    post:
      operationId: initiateToursOperatorPayment
      summary: Initiate Paymob payment for a NEW booking
      description: >
        Creates a PENDING payment record and a Paymob Intention. Returns a
        Unified Checkout URL hosted by Paymob. Amount is always
        taken from the server-side booking snapshot. Idempotent: if a PENDING
        payment already exists, returns the existing checkout URL.
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Already initiated — existing checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorInitiatePaymentResponse"
        "201":
          description: Payment initiated — redirect to checkoutUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorInitiatePaymentResponse"
        "404":
          description: Booking not found.
        "409":
          description: >-
            Booking not in NEW state, or an office booking
            (office_booking_not_payable_online — office payments are recorded
            by staff, never through the online provider).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "502":
          description: Payment provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "503":
          description: >-
            Manager pause (payments_paused) or enquiry-only deployment
            (online_payment_unavailable). No payment is created or checkout resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/bookings/{id}/payment-status:
    get:
      operationId: getToursOperatorPaymentStatus
      summary: Poll payment status after returning from Paymob checkout
      tags:
        - ToursOperator
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorPaymentStatusResponse"
        "404":
          description: No payment record for this booking.
  /api/v1/tours-operator/staff/bookings:
    post:
      operationId: createToursOperatorOfficeBooking
      summary: Create an office booking (staff)
      description: >-
        Requires tours-operator.booking:create-office. Uses the same pricing
        and the same capacity reservation (slot row lock) as the public path.
        Online sales pause and enquiry-only mode do not block staff office
        bookings; a past, blocked or full slot is refused. The booking is CONFIRMED
        at creation (payment is tracked separately, starting UNPAID); it is never expired by the 30-minute
        online payment window and staff cancel it with the normal cancel
        endpoint. Re-sending the same clientRequestId returns the booking
        already created (200).
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToursOperatorOfficeBookingRequest"
      responses:
        "200":
          description: Idempotent replay of an already-created booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "201":
          description: Office booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorBookingResponse"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Slot not found.
        "409":
          description: Slot blocked, in the past, fully booked, tour inactive, or idempotency_key_reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "422":
          description: Pricing does not fit the tour (same codes as the public path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/staff/bookings/{id}/collections:
    get:
      operationId: listToursOperatorOfficeCollections
      summary: Office payment ledger of one booking
      description: Requires tours-operator.booking:view. Append-only entries, oldest first.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ledger entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToursOperatorOfficeCollection"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
    post:
      operationId: recordToursOperatorOfficeCollection
      summary: Record an office payment (staff)
      description: >-
        Requires tours-operator.booking:collect-cash. Manual entry only — no
        online integration. Methods are cash at the office, cash on pickup,
        mobile wallet, the office card terminal, InstaPay and the office Fawry
        machine. Non-cash methods require the receipt reference (unique per
        method); cash must not carry one. EGP settles at today's manager-set
        rate (fx_rate_not_set when none) and needs the quoted fxRateId. The settled EUR can never exceed the
        outstanding balance; the exact EGP value of the balance settles it
        exactly. Entries are separate from Paymob payments. Re-sending the
        same clientRequestId returns the entry already recorded (200).
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordToursOperatorOfficeCollectionRequest"
      responses:
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorOfficeCollectionOutcome"
        "201":
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorOfficeCollectionOutcome"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: >-
            not_an_office_booking, booking_not_open_status_*, amount_exceeds_outstanding,
            reference_already_used, fx_rate_not_set, fx_rate_changed, invalid_correction, idempotency_key_reused,
            or cash_day_closed (a cash method after today's cash box was closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "422":
          description: >-
            amount_below_minimum — an EGP payment worth less than 1.00 EUR at
            today's rate (the payment that settles the exact remaining balance
            is exempt).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/staff/bookings/{id}/collections/quote:
    get:
      operationId: quoteToursOperatorOfficeCollection
      summary: Preview what a payment would settle
      description: >-
        Requires tours-operator.booking:collect-cash. Shows the EUR a payment
        settles at today's manager-set rate before saving; writes nothing.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: currency
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ToursOperatorPaidCurrency"
        - name: amount
          in: query
          required: true
          schema:
            type: number
            minimum: 0.01
      responses:
        "200":
          description: Quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorOfficeCollectionQuote"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Booking not found.
        "409":
          description: not_an_office_booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/staff/bookings/{id}/collections/{collectionId}/reverse:
    post:
      operationId: reverseToursOperatorOfficeCollection
      summary: Reverse an office payment with a reason
      description: >-
        Requires tours-operator.booking:reverse-collection (managers only), and
        the actor must not be the user who recorded the entry (403
        cannot_reverse_own_collection). The only way to correct a mistake: a separate audited REVERSAL entry that cancels one
        collection in full. A collection can be reversed once and a reversal
        is final. A reversed receipt reference stays used unless re-recorded as an
        explicit correction (correctsCollectionId).
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseToursOperatorOfficeCollectionRequest"
      responses:
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorOfficeCollectionOutcome"
        "201":
          description: Reversal recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorOfficeCollectionOutcome"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          description: >-
            Missing the permission, or the actor recorded this entry themselves
            (error cannot_reverse_own_collection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
        "404":
          description: Booking or collection not found.
        "409":
          description: collection_already_reversed, collection_not_reversible, not_an_office_booking, idempotency_key_reused or cash_day_closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/documents/bookings/{id}/voucher:
    post:
      operationId: printToursOperatorVoucher
      summary: Print the customer booking voucher
      description: >-
        Requires tours-operator.document:print. A draft (NEW) or expired booking is refused (booking_not_confirmed); a cancelled booking prints with valid=false (CANCELLED banner, no QR). The QR encodes only the public my-booking URL. Every call records one print in the append-only
        register (version 1 the first time, then numbered reprints that keep the
        document number). No PDF is generated or stored; the response is never
        cached.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintToursOperatorDocumentRequest"
      responses:
        "200":
          description: Document data and its print stamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorVoucherDocument"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Not found.
        "409":
          description: booking_not_confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/documents/collections/{id}/receipt:
    post:
      operationId: printToursOperatorReceipt
      summary: Print the payment receipt of one office collection
      description: >-
        Requires tours-operator.document:print. The id is a COLLECTION entry (a reversal has no receipt: not_a_collection). A reversed payment returns reversed=true for the VOID / REVERSED watermark. The receipt number is sequential per year and immutable; the payment reference is masked but for its last 4 characters. Every call records one print in the append-only
        register (version 1 the first time, then numbered reprints that keep the
        document number). No PDF is generated or stored; the response is never
        cached.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintToursOperatorDocumentRequest"
      responses:
        "200":
          description: Document data and its print stamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorReceiptDocument"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Not found.
        "409":
          description: not_a_collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/documents/bookings/{id}/cancellation-form:
    post:
      operationId: printToursOperatorCancellationForm
      summary: Print the cancellation / money-to-return form
      description: >-
        Requires tours-operator.document:print. Only for a cancelled office booking that still holds collected cash (booking_not_cancelled, no_cash_collected, not_an_office_booking). Read-only: it records no refund. Every call records one print in the append-only
        register (version 1 the first time, then numbered reprints that keep the
        document number). No PDF is generated or stored; the response is never
        cached.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintToursOperatorDocumentRequest"
      responses:
        "200":
          description: Document data and its print stamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorCancellationFormDocument"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Not found.
        "409":
          description: booking_not_cancelled, no_cash_collected or not_an_office_booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorErrorResponse"
  /api/v1/tours-operator/documents/run-sheet:
    post:
      operationId: printToursOperatorRunSheet
      summary: Print the daily run sheet
      description: >-
        Requires tours-operator.document:print-ops. Per tour and departure: guests, hotels, notes. Minimal personal data: lead name, hotel, room and guest count only — no phone numbers. Cancelled and unpaid online bookings are not listed. Every call records one print in the append-only
        register (version 1 the first time, then numbered reprints that keep the
        document number). No PDF is generated or stored; the response is never
        cached.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintToursOperatorRunSheetRequest"
      responses:
        "200":
          description: Document data and its print stamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorRunSheetDocument"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
  /api/v1/tours-operator/documents/slots/{slotId}/pickup-manifest:
    post:
      operationId: printToursOperatorPickupManifest
      summary: Print the pickup manifest of one departure
      description: >-
        Requires tours-operator.document:print-ops. Pickup order by hotel with lead name, room, phone and guests; driver and vehicle come from the departure's assignment (blank when none). Carries phone numbers, hence the separate permission. Every call records one print in the append-only
        register (version 1 the first time, then numbered reprints that keep the
        document number). No PDF is generated or stored; the response is never
        cached.
      tags:
        - ToursOperator
      security:
        - bearerAuth: []
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintToursOperatorDocumentRequest"
      responses:
        "200":
          description: Document data and its print stamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToursOperatorPickupManifestDocument"
        "400":
          $ref: "#/components/responses/ToursOperatorValidationResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: Not found.
