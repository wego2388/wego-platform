components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token issued by POST /api/v1/identity/login.
  responses:
    ToursOperatorMediaUploaded:
      description: Private asset registered; refresh staff content to read its path, dimensions and revision.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ToursOperatorMediaUploadResponse" }
    ToursOperatorMediaInvalid:
      description: Invalid image, alt or media selection.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ToursOperatorMediaError" }
    HealthResponse:
      description: Aggregate health without component details.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    UnauthenticatedResponse:
      description: Missing, invalid, or expired session token.
      headers:
        WWW-Authenticate:
          description: Always `Bearer` — the authentication scheme this API accepts.
          schema:
            type: string
            enum:
              - Bearer
    ForbiddenResponse:
      description: Authenticated, but missing the permission this operation requires.
    RateLimitedResponse:
      description: >-
        Too many login attempts — from this network address (an edge-level
        limit) or against this email (an application-level limit that closes
        the same gap for a caller spreading attempts across many source
        addresses). Both return this identical shape.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginError"
    ToursOperatorValidationResponse:
      description: Malformed or domain-invalid tours-operator request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  parameters:
    ToursOperatorMediaCategory:
      name: category
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ToursOperatorCategory" }
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        A caller-supplied correlation id, which must be a valid UUID.
        Echoed back on the response's `X-Correlation-Id` header and
        threaded through this request's audit and outbox records. If
        omitted or not a valid UUID, a new id is generated instead —
        malformed input never fails the request and never breaks
        traceability, it only replaces the id.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationIdResponseHeader:
      description: >-
        The correlation id that applies to this request — the caller's
        own `X-Correlation-Id`, or a newly generated one if none was
        supplied or the supplied value was rejected. The same id appears
        on this request's audit and outbox records.
      schema:
        type: string
        format: uuid
  schemas:
    ToursOperatorMediaUploadResponse:
      type: object
      additionalProperties: false
      required: [assetId, mediaId]
      properties:
        assetId: { type: string, format: uuid }
        mediaId: { type: [string, "null"], format: uuid }
    ToursOperatorMediaError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    ToursOperatorMediaUploadRequest:
      type: object
      required: [file, requestId]
      properties:
        file: { type: string, format: binary }
        requestId:
          type: string
          format: uuid
          description: Stable per-attempt UUID. Replay with same owner, bytes and alt returns same linked asset; reuse with changed input is rejected.
        mediaId: { type: string, format: uuid }
        revision: { type: string, maxLength: 64 }
        altEn: { type: string, maxLength: 200 }
        altAr: { type: string, maxLength: 200 }
        altRu: { type: string, maxLength: 200 }
        altIt: { type: string, maxLength: 200 }
    ToursOperatorCategoryAltRequest:
      type: object
      required: [revision]
      properties:
        revision: { type: string, maxLength: 64 }
        altEn: { type: [string, "null"], maxLength: 200 }
        altAr: { type: [string, "null"], maxLength: 200 }
        altRu: { type: [string, "null"], maxLength: 200 }
        altIt: { type: [string, "null"], maxLength: 200 }
    ToursOperatorPublicMedia:
      type: object
      additionalProperties: false
      required: [path, width, height, isCover, alt]
      properties:
        path: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        isCover: { type: boolean }
        alt: { type: string }
    ToursOperatorPublicCategoryCover:
      type: object
      additionalProperties: false
      required: [category, path, width, height, alt]
      properties:
        category: { $ref: "#/components/schemas/ToursOperatorCategory" }
        path: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt: { type: string }
    ToursOperatorCategoryMedia:
      type: object
      required: [category, assetId, alt, rightsStatus, approvedAt, updatedAt, revision, path, width, height]
      properties:
        category: { $ref: "#/components/schemas/ToursOperatorCategory" }
        assetId: { type: [string, "null"], format: uuid }
        alt:
          type: object
          additionalProperties: { type: string, maxLength: 200 }
        rightsStatus: { type: string, enum: [DRAFT, APPROVED] }
        approvedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        revision: { type: string }
        path: { type: [string, "null"] }
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 320
        password:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: "Opaque bearer token; send as `Authorization: Bearer <token>`."
        expiresAt:
          type: string
          format: date-time
    LoginError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_credentials
            - rate_limited
            - validation_failed
    IdentityProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - email
        - roles
        - permissions
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    StaffUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - status
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    CreateStaffUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - roleCodes
      properties:
        email:
          type: string
        password:
          type: string
        roleCodes:
          type: array
          items:
            type: string
    StaffRole:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissions
      properties:
        code:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - description
        - permissionCodes
      properties:
        code:
          type: string
        description:
          type: string
        permissionCodes:
          type: array
          items:
            type: string
    PermissionCatalogEntry:
      type: object
      additionalProperties: false
      required:
        - code
        - description
      properties:
        code:
          type: string
        description:
          type: string
    IdentityAdminError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: >-
            One of: email_already_in_use, unknown_role:<code>,
            cannot_disable_self, already_disabled, already_active,
            cannot_change_own_roles, role_already_exists,
            unknown_permission:<code>.
    OfferingType:
      type: string
      enum:
        - DIVE_TRIP
        - COURSE
        - EQUIPMENT_RENTAL
        - PACKAGE
    OfferingStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
    BookingStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
    PaymentStatus:
      type: string
      enum:
        - UNPAID
        - PAID
        - REFUNDED
    PricingBasis:
      type: string
      description: >-
        How an offering's `unitPrice` combines with a booking's party size
        to produce the booking's total. `PER_PARTICIPANT` multiplies
        `unitPrice` by `partySize`; `FLAT` charges `unitPrice` once
        regardless of party size (e.g. a whole-boat charter or a
        flat-rate equipment rental).
      enum:
        - PER_PARTICIPANT
        - FLAT
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currencyCode
      properties:
        amount:
          type: string
          pattern: "^\\d{1,17}\\.\\d{2}$"
          description: >-
            Decimal string with exactly 2 places, e.g. "45.00" — never a
            binary float, never a different scale.
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
    ToursOperatorTourType:
      type: string
      enum:
        - TOUR
        - TRANSFER
        - REQUEST_ONLY
    ToursOperatorCancellationPolicy:
      type: string
      enum:
        - STANDARD
        - FLEXIBLE
        - NON_REFUNDABLE
    ToursOperatorCategory:
      type: string
      enum:
        - DESERT
        - SEA
        - CULTURAL
        - SHOWS
        - TRANSFERS
    ToursOperatorTimeSlot:
      type: string
      enum:
        - SUNRISE
        - MORNING
        - AFTERNOON
        - SUNSET
    ToursOperatorBookingChannel:
      type: string
      description: >-
        ONLINE = public checkout (30-minute payment window); OFFICE = created
        by staff (no payment window, never auto-expired).
      enum:
        - ONLINE
        - OFFICE
    ToursOperatorPaidCurrency:
      type: string
      enum:
        - EUR
        - EGP
    ToursOperatorCollectionMethod:
      type: string
      description: >-
        Manual office payment methods. Cash methods carry no reference;
        every other method requires the receipt reference.
      enum:
        - CASH_AT_OFFICE
        - CASH_ON_PICKUP
        - MOBILE_WALLET
        - CARD_TERMINAL
        - INSTAPAY
        - FAWRY_OFFICE
    ToursOperatorOfficePaymentState:
      type: string
      enum:
        - UNPAID
        - PARTIALLY_PAID
        - PAID
    ToursOperatorOfficePayment:
      type: object
      additionalProperties: false
      required:
        - state
        - collected
        - outstanding
        - cashToReturn
        - refunded
      properties:
        state:
          $ref: "#/components/schemas/ToursOperatorOfficePaymentState"
        collected:
          $ref: "#/components/schemas/Money"
        outstanding:
          $ref: "#/components/schemas/Money"
        cashToReturn:
          description: >-
            Set when a cancelled booking still holds collected money not yet
            returned (collected minus office refunds recorded).
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        refunded:
          description: Money already returned (office refunds net of reversals, EUR).
          $ref: "#/components/schemas/Money"
    CreateToursOperatorOfficeBookingRequest:
      type: object
      additionalProperties: false
      required:
        - clientRequestId
        - slotId
        - adultsCount
        - childrenCount
        - customer
        - hotelName
        - locale
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Idempotency key generated by the client.
        slotId:
          type: string
          format: uuid
        adultsCount:
          type: integer
          minimum: 1
          maximum: 50
        childrenCount:
          type: integer
          minimum: 0
          maximum: 50
        priceOptionCode:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
        unitCount:
          type: integer
          minimum: 1
          maximum: 50
        customer:
          $ref: "#/components/schemas/ToursOperatorCustomerRequest"
        hotelName:
          type: string
          minLength: 1
          maxLength: 200
        hotelRoom:
          type: string
          maxLength: 32
        specialRequests:
          type: string
          maxLength: 4000
        locale:
          type: string
          enum:
            - en
            - ar
            - ru
            - it
    RecordToursOperatorOfficeCollectionRequest:
      type: object
      additionalProperties: false
      required:
        - clientRequestId
        - method
        - amount
      properties:
        clientRequestId:
          type: string
          format: uuid
        method:
          $ref: "#/components/schemas/ToursOperatorCollectionMethod"
        amount:
          type: number
          minimum: 0.01
          description: What the customer handed over, in `currency`, at most two decimals.
        currency:
          allOf:
            - $ref: "#/components/schemas/ToursOperatorPaidCurrency"
          default: EUR
          description: EGP settles at today's manager-set rate; staff cannot supply a rate.
        reference:
          type: string
          maxLength: 64
          description: >-
            Receipt number from the terminal, wallet, InstaPay or Fawry.
            Required for non-cash, forbidden for cash. Trimmed, no control
            characters, unique per method.
        fxRateId:
          type: string
          format: uuid
          description: >-
            The rate id returned by the quote; required for EGP. If the
            manager changed today's rate since, the server answers 409
            fx_rate_changed and the client must re-quote.
        correctsCollectionId:
          type: string
          format: uuid
          description: >-
            Re-records a REVERSED collection of this booking with the same
            method and reference — the only way a receipt reference is reused,
            and each reversed entry can be corrected once.
    ReverseToursOperatorOfficeCollectionRequest:
      type: object
      additionalProperties: false
      required:
        - clientRequestId
        - reason
      properties:
        clientRequestId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ToursOperatorOfficeCollection:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - method
        - amount
        - amountPaid
        - fxRate
        - reference
        - reversesCollectionId
        - reason
        - recordedByUserId
        - recordedByEmail
        - recordedAt
        - correctsCollectionId
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - COLLECTION
            - REVERSAL
        method:
          $ref: "#/components/schemas/ToursOperatorCollectionMethod"
        amount:
          description: EUR settled against the booking balance.
          $ref: "#/components/schemas/Money"
        amountPaid:
          description: What the customer handed over, in EUR or EGP.
          $ref: "#/components/schemas/Money"
        fxRate:
          description: EGP per 1 EUR used for an EGP payment; null for EUR.
          type:
            - string
            - "null"
        reference:
          type:
            - string
            - "null"
        reversesCollectionId:
          type:
            - string
            - "null"
          format: uuid
        reason:
          type:
            - string
            - "null"
        recordedByUserId:
          type:
            - string
            - "null"
          format: uuid
        recordedByEmail:
          description: Staff user who recorded (or reversed) the entry.
          type:
            - string
            - "null"
        recordedAt:
          type: string
          format: date-time
        correctsCollectionId:
          type:
            - string
            - "null"
          format: uuid
    ToursOperatorOfficeCollectionOutcome:
      type: object
      additionalProperties: false
      required:
        - entry
        - officePayment
      properties:
        entry:
          $ref: "#/components/schemas/ToursOperatorOfficeCollection"
        officePayment:
          $ref: "#/components/schemas/ToursOperatorOfficePayment"
    PrintToursOperatorDocumentRequest:
      type: object
      additionalProperties: false
      required:
      - language
      properties:
        language:
          type: string
          enum:
          - en
          - ar
    PrintToursOperatorRunSheetRequest:
      type: object
      additionalProperties: false
      required:
      - date
      - language
      properties:
        date:
          type: string
          format: date
        language:
          type: string
          enum:
          - en
          - ar
    ToursOperatorDocumentStamp:
      type: object
      additionalProperties: false
      required:
      - type
      - number
      - version
      - language
      - copy
      - revised
      - originalPrintedAt
      - printedAt
      - printedByEmail
      properties:
        type:
          type: string
          enum:
          - VOUCHER
          - RECEIPT
          - RUN_SHEET
          - PICKUP_MANIFEST
          - CANCELLATION_FORM
          - DRIVER_SHEET
          - SUPPLIER_ORDER
          - SETTLEMENT_STATEMENT
        number:
          type: string
          description: Immutable document number; reprints carry the original's.
        version:
          type: integer
          minimum: 1
          description: 1 = original, n = reprint.
        language:
          type: string
          enum:
          - en
          - ar
        copy:
          type: boolean
          description: 'True for a reprint of unchanged content: the page prints COPY / نسخة with the version and the original date.'
        revised:
          type: boolean
          description: 'True for a run sheet or pickup manifest reprinted after its content changed since the previous print: the page prints REVISED / نسخة معدّلة with the version and the revision time (printedAt), not COPY.'
        originalPrintedAt:
          type: string
          format: date-time
        printedAt:
          type: string
          format: date-time
        printedByEmail:
          anyOf:
          - type: string
          - type: 'null'
    ToursOperatorVoucherData:
      type: object
      additionalProperties: false
      required:
      - reference
      - status
      - valid
      - channel
      - tourNameEn
      - tourNameAr
      - tourDate
      - timeSlot
      - adultsCount
      - childrenCount
      - unit
      - customerName
      - hotelName
      - hotelRoom
      - totalPrice
      - payment
      - contentLanguage
      - includes
      - excludes
      - knowBeforeYouGo
      - meetingPoint
      - myBookingUrl
      properties:
        reference:
          type: string
        status:
          $ref: '#/components/schemas/ToursOperatorBookingStatus'
        valid:
          type: boolean
          description: 'False for a cancelled booking: print a CANCELLED banner and no QR.'
        channel:
          $ref: '#/components/schemas/ToursOperatorBookingChannel'
        tourNameEn:
          type: string
        tourNameAr:
          anyOf:
          - type: string
          - type: 'null'
        tourDate:
          type: string
          format: date
        timeSlot:
          $ref: '#/components/schemas/ToursOperatorTimeSlot'
        adultsCount:
          type: integer
        childrenCount:
          type: integer
        unit:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - optionLabel
            - unitCount
            properties:
              optionLabel:
                type: string
              unitCount:
                type: integer
          - type: 'null'
        customerName:
          type: string
        hotelName:
          type: string
        hotelRoom:
          anyOf:
          - type: string
          - type: 'null'
        totalPrice:
          $ref: '#/components/schemas/Money'
        payment:
          type: object
          additionalProperties: false
          required:
          - kind
          - state
          - collected
          - outstanding
          properties:
            kind:
              type: string
              enum:
              - OFFICE
              - ONLINE
            state:
              type: string
              description: 'Office: UNPAID, PARTIALLY_PAID, PAID. Online: the provider payment state or NONE.'
            collected:
              anyOf:
              - $ref: '#/components/schemas/Money'
              - type: 'null'
            outstanding:
              anyOf:
              - $ref: '#/components/schemas/Money'
              - type: 'null'
        contentLanguage:
          type: string
        includes:
          type: array
          items:
            type: string
        excludes:
          type: array
          items:
            type: string
        knowBeforeYouGo:
          type: array
          items:
            type: string
        meetingPoint:
          anyOf:
          - type: string
          - type: 'null'
        myBookingUrl:
          anyOf:
          - type: string
            description: The public my-booking page only — no reference, phone or token. Null when the booking
              is not valid.
          - type: 'null'
    ToursOperatorReceiptData:
      type: object
      additionalProperties: false
      required:
      - bookingReference
      - tourNameEn
      - tourNameAr
      - tourDate
      - customerName
      - method
      - currencyPaid
      - amountPaid
      - settledEur
      - fxRate
      - referenceMasked
      - recordedAt
      - collectedBy
      - bookingTotal
      - collectedToDate
      - remainingAfter
      - reversed
      - reversal
      properties:
        bookingReference:
          type: string
        tourNameEn:
          type: string
        tourNameAr:
          anyOf:
          - type: string
          - type: 'null'
        tourDate:
          type: string
          format: date
        customerName:
          type: string
        method:
          $ref: '#/components/schemas/ToursOperatorCollectionMethod'
        currencyPaid:
          $ref: '#/components/schemas/ToursOperatorPaidCurrency'
        amountPaid:
          $ref: '#/components/schemas/Money'
        settledEur:
          $ref: '#/components/schemas/Money'
        fxRate:
          anyOf:
          - type: string
          - type: 'null'
        referenceMasked:
          anyOf:
          - type: string
            description: Receipt number masked but for its last 4 characters; null for cash. Never card data.
          - type: 'null'
        recordedAt:
          type: string
          format: date-time
        collectedBy:
          anyOf:
          - type: string
          - type: 'null'
        bookingTotal:
          $ref: '#/components/schemas/Money'
        collectedToDate:
          $ref: '#/components/schemas/Money'
        remainingAfter:
          $ref: '#/components/schemas/Money'
        reversed:
          type: boolean
          description: 'True when a reversal cancelled this payment: print a VOID / REVERSED watermark.'
        reversal:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - entryRef
            - recordedAt
            properties:
              entryRef:
                type: string
              recordedAt:
                type: string
                format: date-time
          - type: 'null'
    ToursOperatorRunSheetData:
      type: object
      additionalProperties: false
      required:
      - date
      - totalGuests
      - tours
      properties:
        date:
          type: string
          format: date
        totalGuests:
          type: integer
        tours:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - tourId
            - tourNameEn
            - tourNameAr
            - guests
            - departures
            properties:
              tourId:
                type: string
                format: uuid
              tourNameEn:
                type: string
              tourNameAr:
                anyOf:
                - type: string
                - type: 'null'
              guests:
                type: integer
              departures:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - timeSlot
                  - guests
                  - hotels
                  - lines
                  - notes
                  properties:
                    timeSlot:
                      $ref: '#/components/schemas/ToursOperatorTimeSlot'
                    guests:
                      type: integer
                    hotels:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - hotelName
                        - guests
                        properties:
                          hotelName:
                            type: string
                          guests:
                            type: integer
                    lines:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - reference
                        - leadName
                        - hotelName
                        - hotelRoom
                        - guests
                        - paymentDue
                        properties:
                          reference:
                            type: string
                          leadName:
                            type: string
                          hotelName:
                            type: string
                          hotelRoom:
                            anyOf:
                            - type: string
                            - type: 'null'
                          guests:
                            type: integer
                          paymentDue:
                            type: boolean
                    notes:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - reference
                        - text
                        properties:
                          reference:
                            type: string
                          text:
                            type: string
    ToursOperatorPickupManifestData:
      type: object
