    post: {"operationId": "confirmToursOperatorCashDay", "summary": "Confirm and close the day", "description": "Requires tours-operator.cash-box:confirm (manager), never the person who counted (403 cannot_confirm_own_count). If cash was recorded after the count: 409 cash_expected_changed (count again). A closed day refuses every cash entry.", "tags": ["ToursOperator"], "security": [{"bearerAuth": []}], "parameters": [{"name": "date", "in": "path", "required": true, "schema": {"type": "string", "format": "date"}}, {"name": "currency", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ToursOperatorPaidCurrency"}}], "responses": {"201": {"description": "Closed.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorCashDay"}}}}, "409": {"description": "cash_day_not_counted, cash_day_closed or cash_expected_changed (details.expected).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorFinanceError"}}}}, "400": {"$ref": "#/components/responses/ToursOperatorValidationResponse"}, "401": {"$ref": "#/components/responses/UnauthenticatedResponse"}, "403": {"$ref": "#/components/responses/ForbiddenResponse"}}}
