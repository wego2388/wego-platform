    get: {"operationId": "getToursOperatorProfitability", "summary": "Profitability by booking, departure, tour or month", "description": "Requires tours-operator.payment:view (the existing finance permission). Bookings by tour day (range ≤ 366 days; 400 invalid_date_range). Costs = components in force on the day × guests; per-departure costs, driver trip rate and payable adjustments of the departure are shared by guests. EGP converts at the departure-day manager rate, else the latest rate (rateSource says which). A missing cost shows no profit.", "tags": ["ToursOperator"], "security": [{"bearerAuth": []}], "parameters": [{"name": "from", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}, {"name": "to", "in": "query", "required": true, "schema": {"type": "string", "format": "date"}}, {"name": "groupBy", "in": "query", "required": false, "schema": {"type": "string", "enum": ["BOOKING", "DEPARTURE", "TOUR", "MONTH"]}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ToursOperatorProfitReport"}}}}, "400": {"$ref": "#/components/responses/ToursOperatorValidationResponse"}, "401": {"$ref": "#/components/responses/UnauthenticatedResponse"}, "403": {"$ref": "#/components/responses/ForbiddenResponse"}}}
