spring:
  application:
    name: wego-sharm-to-go
  datasource:
    url: ${WEGO_DB_URL:jdbc:postgresql://localhost:5432/wego_sharm_to_go}
    username: ${WEGO_DB_USERNAME:wego_app}
    password: ${WEGO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${WEGO_DB_POOL_SIZE:10}
      minimum-idle: 0
  flyway:
    enabled: ${WEGO_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-migration-naming: true
  jooq:
    sql-dialect: POSTGRES
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # The request-expiry sweep and email delivery must never share one
      # thread: a slow mail relay may not stop overdue requests from expiring.
      pool:
        size: 2
  modulith:
    runtime:
      verification-enabled: true

# Request emails (STG-NOTIFY). SMTP is configured through
# TRAVEL_NOTIFICATIONS_SMTP_HOST / _PORT / _USERNAME / _PASSWORD, not through
# spring.mail.*: an empty spring.mail.host still makes Spring Boot build a
# mail sender and a failing mail health check. Enabling the dispatcher
# without a host fails startup on purpose.
# Disabled by default: rows stay PENDING (visible to staff) until enabled.
travel-marketplace:
  notifications:
    enabled: ${TRAVEL_NOTIFICATIONS_ENABLED:false}
    from: ${TRAVEL_NOTIFICATIONS_FROM:}
    reply-to: ${TRAVEL_NOTIFICATIONS_REPLY_TO:}
    staff-address: ${TRAVEL_NOTIFICATIONS_STAFF_ADDRESS:}
    site-base-url: ${TRAVEL_NOTIFICATIONS_SITE_BASE_URL:http://localhost:3000}
    whatsapp: ${TRAVEL_NOTIFICATIONS_WHATSAPP:+20 10 0141 3469}
    contact-email: ${TRAVEL_NOTIFICATIONS_CONTACT_EMAIL:info@sharmtogo.com}
    max-attempts: ${TRAVEL_NOTIFICATIONS_MAX_ATTEMPTS:5}
    smtp:
      host: ${TRAVEL_NOTIFICATIONS_SMTP_HOST:}
      port: ${TRAVEL_NOTIFICATIONS_SMTP_PORT:587}
      username: ${TRAVEL_NOTIFICATIONS_SMTP_USERNAME:}
      password: ${TRAVEL_NOTIFICATIONS_SMTP_PASSWORD:}

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true
    # An SMTP outage must never make the whole API unhealthy (the compose
    # healthcheck would stop the edge); email failures show in the
    # Notifications page instead.
    mail:
      enabled: false
