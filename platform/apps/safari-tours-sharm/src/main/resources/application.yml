spring:
  application:
    name: wego-safari-tours-sharm
  datasource:
    url: ${WEGO_DB_URL:jdbc:postgresql://localhost:5432/wego_safari_tours_sharm}
    username: ${WEGO_DB_USERNAME:wego_app}
    password: ${WEGO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${WEGO_DB_POOL_SIZE:10}
      minimum-idle: 0
  flyway:
    enabled: ${WEGO_FLYWAY_ENABLED:false}
    locations: classpath:db/migration,classpath:db/migration/data
    validate-migration-naming: true
  jooq:
    sql-dialect: POSTGRES
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
  task:
    scheduling:
      # Booking expiry and customer email delivery must never share one
      # thread: a slow mail relay may not stop unpaid bookings from expiring.
      pool:
        size: 2
  modulith:
    runtime:
      verification-enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    # Bounded discard budget above the 11 MiB edge/request limit, not unlimited.
    # Tomcat's default 2 MiB can reset the socket before a rejected upload's 413 is read.
    max-swallow-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true

tours-operator:
  booking-mode: ${TOURS_OPERATOR_BOOKING_MODE:ONLINE_PAYMENT}
  paymob:
    mock-enabled: ${TOURS_OPERATOR_PAYMOB_MOCK_ENABLED:false}
  # Customer emails (WEGO-016-G). SMTP itself is configured only through the
  # standard SPRING_MAIL_HOST / _PORT / _USERNAME / _PASSWORD environment
  # variables; enabling the dispatcher without them fails startup on purpose.
  notifications:
    enabled: ${TOURS_OPERATOR_NOTIFICATIONS_ENABLED:false}
    from: ${TOURS_OPERATOR_NOTIFICATIONS_FROM:}
    reply-to: ${TOURS_OPERATOR_NOTIFICATIONS_REPLY_TO:}
    site-base-url: ${TOURS_OPERATOR_SITE_BASE_URL:http://localhost:3000}
    review-url: ${TOURS_OPERATOR_REVIEW_URL:}
    max-attempts: ${TOURS_OPERATOR_NOTIFICATIONS_MAX_ATTEMPTS:5}
    review-request-delay: ${TOURS_OPERATOR_REVIEW_REQUEST_DELAY:PT24H}
  # Media / asset storage (WEGO-016-MEDIA).
  # volume-path must point to the durable, isolated Safari media volume.
  # The default is suitable for local development only; set TOURS_OPERATOR_MEDIA_VOLUME_PATH
  # in Compose/production to the real volume mount point.
  media:
    volume-path: ${TOURS_OPERATOR_MEDIA_VOLUME_PATH:/tmp/safari-media-dev}
