worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # $sent_http_x_correlation_id captures the response header actually
    # sent to the client — the backend's CorrelationIdFilter always sets
    # it (the caller's own value if valid, otherwise a generated one), so
    # this is the real correlation id for the request, not just whatever
    # the client happened to send.
    log_format wego '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'correlation_id=$sent_http_x_correlation_id';
    access_log /dev/stdout wego;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream wego_backend {
        server backend:8080;
        keepalive 16;
    }

    upstream wego_web {
        server web:3000;
        keepalive 16;
    }

    # A wrong-password login runs bcrypt (deliberately slow) and writes to
    # PostgreSQL on every attempt (see LoginService) — unlimited attempts let
    # a caller either exhaust those resources or grind a known account's
    # lockout threshold on purpose. Edge-level, per-IP: matches
    # SECURITY_MODEL.md's "Edge and application rate limits protect
    # authentication" without needing new backend state (Redis, a counter
    # table) for this first identity packet.
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;

    # nginx's `add_header` stops inheriting from every ancestor level the
    # moment a location defines its own (a well-known nginx quirk), so
    # every location below repeats this full set explicitly rather than
    # relying on inheritance silently working for some and not others.
    #
    # script-src keeps 'unsafe-inline': Nuxt 4's default node-server build
    # (no CSP-nonce module configured) ships a real, executable inline
    # `<script>` for its hydration bootstrap, not just an inert JSON data
    # island — a strict `script-src 'self'` blocks it and the app never
    # hydrates (`Cannot read properties of undefined (reading 'app')`,
    # confirmed live with a headless Chromium run against this exact
    # config). style-src does NOT need the same exception — verified with
    # the same live-browser method (zero CSP console violations across
    # login, offerings, and the full booking lifecycle) after an
    # independent Tier 1 review questioned whether it was still necessary;
    # it was not, and was removed. Tightening script-src further would mean
    # adopting a nonce-based CSP via a dedicated Nuxt module — a real
    # follow-up, out of scope for this packet; see the execution board's
    # residual risks for WEGO-002.
    server {
        listen 8080;
        charset utf-8;
        client_max_body_size 2m;
        limit_req_status 429;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            proxy_pass http://wego_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /api/v1/identity/login {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            # burst raised 3 -> 6 (2026-09-01): the E2E suite's own 6
            # sequential lifecycle tests each perform one real login against
            # this same edge limiter within one CI run's ~40s window,
            # started tripping this exact 429 the moment a 6th test.describe
            # block (WEGO-012's financial-reports test) was added —
            # reproduced live in two consecutive real CI runs, always the
            # 6th login, never earlier ones. `rate=5r/m` (the sustained-rate
            # cap, and the actually meaningful anti-brute-force limit) is
            # unchanged; only the one-time burst allowance grew to fit a
            # legitimate CI burst, not to weaken the limiter against a
            # sustained attack.
            limit_req zone=login_rate burst=6 nodelay;
            # nginx's own 429 is an HTML error page with no Retry-After —
            # the login contract only documents JSON bodies (see
            # platform/contracts/openapi/v1/wego-api.yaml), so a client
            # parsing every login response as JSON would break on it.
            # `=` keeps the real 429 status; only the body/headers come
            # from the named location.
            error_page 429 = @login_rate_limited;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @login_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            # Matches login_rate's rate=5r/m: one token replenishes every
            # 12s, so that's the earliest a retry could succeed.
            add_header Retry-After 12 always;
            return 429 '{"error":"rate_limited"}';
        }

        # Every other API route — everything under /api/** except the
        # explicitly rate-limited login route above, which nginx's `=`
        # exact-match location already takes precedence over this prefix
        # match regardless of declaration order.
        location /api/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ERP pages and assets — everything not matched above.
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
