worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # $sent_http_x_correlation_id captures the response header actually
    # sent to the client — the backend's CorrelationIdFilter always sets
    # it (the caller's own value if valid, otherwise a generated one), so
    # this is the real correlation id for the request, not just whatever
    # the client happened to send.
    # Deliberately log the normalized path without `$args` or `$http_referer`.
    # Paymob sends its HMAC in the query string and booking/payment pages may
    # contain recovery identifiers. `$request` or a full same-origin Referer
    # would persist those credentials in edge logs, including on subsequent
    # asset requests. Method + `$uri` + protocol preserves the operational
    # signal without query or navigation data.
    log_format wego '$remote_addr - $request_id [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" '
                    'correlation_id=$sent_http_x_correlation_id';
    access_log /dev/stdout wego;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream wego_backend {
        server backend:8080;
        keepalive 16;
    }

    # Compress text responses (HTML always, plus CSS/JS/SVG/XML/plain text).
    # JSON is deliberately left out: API responses (e.g. the login token) must
    # not share compression contexts with attacker-influenced input (BREACH).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;

    upstream wego_web {
        server web:3000;
        keepalive 16;
    }

    upstream wego_safari_site {
        server safari-site:3001;
        keepalive 16;
    }

    # A wrong-password login runs bcrypt (deliberately slow) and writes to
    # PostgreSQL on every attempt (see LoginService) — unlimited attempts let
    # a caller either exhaust those resources or grind a known account's
    # lockout threshold on purpose. Edge-level, per-IP: matches
    # SECURITY_MODEL.md's "Edge and application rate limits protect
    # authentication" without needing new backend state (Redis, a counter
    # table) for this first identity packet.
    # The edge only listens on a loopback-published port, so every request
    # comes through the host's TLS terminator (or docker's port proxy). Take
    # the client address from X-Forwarded-For set by those trusted hops so
    # each visitor gets their own rate-limit bucket. The terminator must
    # overwrite (not append to) X-Forwarded-For with the real client IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Scheme passed to the apps. In production TLS ends at the host's
    # gateway, so this edge always sees plain http and `$scheme` alone would
    # tell the backend/site every request was insecure. Accept the gateway's
    # X-Forwarded-Proto only when the TCP peer (before real_ip rewrote
    # $remote_addr) is one of the same loopback/private hops trusted above,
    # and only the literal value "https"; anything else falls back to this
    # edge's own scheme. Internet clients cannot reach the loopback-published
    # port directly, and the gateway must overwrite (never pass through) the
    # visitor's X-Forwarded-Proto. Local stacks without a gateway send no
    # header and keep `http`, exactly as before.
    # Every other forwarding header a framework might honour (RFC 7239
    # Forwarded, X-Forwarded-Host/-Port/-Prefix/-Ssl) is cleared per
    # location: the apps derive host and port from Host + this scheme only.
    geo $realip_remote_addr $wego_trusted_hop {
        default 0;
        127.0.0.1/32 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
    }
    map "$wego_trusted_hop:$http_x_forwarded_proto" $wego_forwarded_proto {
        default $scheme;
        "1:https" https;
    }

    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=booking_lookup_rate:10m rate=10r/m;
    # Public money path: creating a booking holds places for 30 minutes and
    # starting a payment opens a provider order, so both are per-IP limited.
    limit_req_zone $binary_remote_addr zone=booking_create_rate:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=payment_start_rate:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=media_upload_rate:10m rate=10r/m;

    # nginx's `add_header` stops inheriting from every ancestor level the
    # moment a location defines its own (a well-known nginx quirk), so
    # every location below repeats this full set explicitly rather than
    # relying on inheritance silently working for some and not others.
    #
    # script-src keeps 'unsafe-inline': Nuxt 4's default node-server build
    # (no CSP-nonce module configured) ships a real, executable inline
    # `<script>` for its hydration bootstrap, not just an inert JSON data
    # island — a strict `script-src 'self'` blocks it and the app never
    # hydrates (`Cannot read properties of undefined (reading 'app')`,
    # confirmed live with a headless Chromium run against this exact
    # config). style-src does NOT need the same exception — verified with
    # the same live-browser method (zero CSP console violations across
    # login, offerings, and the full booking lifecycle) after an
    # independent Tier 1 review questioned whether it was still necessary;
    # it was not, and was removed. Tightening script-src further would mean
    # adopting a nonce-based CSP via a dedicated Nuxt module — a real
    # follow-up, out of scope for this packet; see the execution board's
    # residual risks for WEGO-002.
    server {
        listen 8080 default_server;
        # Nginx request errors, including critical temp-file failures, append
        # raw queries/referrers. Keep startup diagnostics above and safe access
        # status/path/correlation below, but suppress request error logs.
        error_log /dev/null crit;
        server_name _;
        charset utf-8;
        client_max_body_size 64k;
        limit_req_status 429;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            proxy_pass http://wego_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Public booking recovery uses two knowledge factors and returns
        # customer booking data. Keep it separately rate-limited from login;
        # the JSON body also keeps reference/phone out of access-log URLs.
        location = /api/v1/tours-operator/bookings/lookup {
            limit_req zone=booking_lookup_rate burst=5 nodelay;
            error_page 429 = @booking_lookup_rate_limited;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @booking_lookup_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header Retry-After 6 always;
            return 429 '{"error":"rate_limited"}';
        }

        # The customer origin exposes only the API the public site uses.
        # Staff and identity APIs live on the staff origin; everything else
        # under /api/ is a 404 here.
        # Both public writes are independently revalidated by the backend.
        # Requests save intent only; paid bookings may reserve inventory.
        location ~ ^/api/v1/tours-operator/(bookings|booking-requests)$ {
            limit_req zone=booking_create_rate burst=20 nodelay;
            error_page 429 = @public_api_rate_limited;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ "^/api/v1/tours-operator/bookings/[0-9a-fA-F-]{36}/pay$" {
            limit_req zone=payment_start_rate burst=20 nodelay;
            error_page 429 = @public_api_rate_limited;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ "^/api/v1/tours-operator/(tours|tours/.+|categories/media|sales-status|bookings/[0-9a-fA-F-]{36}/payment-status|payments/paymob-callback)$" {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @public_api_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header Retry-After 3 always;
            return 429 '{"error":"rate_limited"}';
        }

        location /api/ {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            return 404 '{"error":"not_found"}';
        }

        # Safari Tours Sharm public site routes.
        # These prefixes belong to the safari-tours-sharm-site Nuxt app,
        # served on safari-site:3001. They must appear before the catch-all
        # ERP location so nginx matches them first.
        location ^~ /_safari/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_safari_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # The public brand homepage owns the bare domain root. Without this
        # exact match the ERP catch-all below serves its staff login at `/`,
        # making the customer-facing site unreachable from the domain.
        location = / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_safari_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # The public site's only root-level static asset. Application bundles
        # already have their isolated `/_safari/` namespace.
        location = /favicon.svg {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Cache-Control "public, max-age=86400" always;
            proxy_pass http://wego_safari_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/(tours|tour|category|booking|my-booking|contact|privacy|terms)(/|$) {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_safari_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Managed files never enter Nuxt's static/IPX tree. Every request goes
        # through the current rights/linkage/activity gate; no proxy cache.
        location ~ "^/media/(tours|categories)/[a-zA-Z0-9-]+/[0-9a-f-]{36}\\.(jpg|png)$" {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Public-site catch-all. Staff pages live on the dedicated staff host
        # below, so a public deep-link can never be served by the ERP app.
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_safari_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # Staff ERP has a separate origin. This removes public/ERP route ownership
    # collisions and keeps the bearer token outside the customer-site origin.
    server {
        listen 8080;
        error_log /dev/null crit;
        server_name staff.localhost staff.safaritourssharm.com;
        charset utf-8;
        client_max_body_size 2m;
        limit_req_status 429;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            proxy_pass http://wego_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
        }

        location = /api/v1/identity/login {
            limit_req zone=login_rate burst=6 nodelay;
            error_page 429 = @staff_login_rate_limited;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
        }

        location @staff_login_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header Retry-After 12 always;
            return 429 '{"error":"rate_limited"}';
        }

        location ~ "^/api/v1/tours-operator/staff/(tours/[0-9a-fA-F-]{36}|categories/(DESERT|SEA|CULTURAL|SHOWS|TRANSFERS))/media/upload$" {
            client_max_body_size 11m;
            limit_req zone=media_upload_rate burst=3 nodelay;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Customer booking recovery belongs exclusively to the public origin.
        # The staff origin has its own authenticated booking screens and must
        # not provide a second, unthrottled path to this public knowledge-factor endpoint.
        location = /api/v1/tours-operator/bookings/lookup {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            return 404 '{"error":"not_found"}';
        }

        location /api/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://wego_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://wego_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $wego_forwarded_proto;
            proxy_set_header Forwarded ""; proxy_set_header X-Forwarded-Host ""; proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix ""; proxy_set_header X-Forwarded-Ssl "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
