worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Never persist query strings: booking and identity recovery values do not
    # belong in edge logs.
    log_format wego '$remote_addr - $request_id [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" correlation_id=$sent_http_x_correlation_id';
    access_log /dev/stdout wego;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream divers_backend { server backend:8080; keepalive 16; }
    upstream divers_site { server site:3000; keepalive 16; }
    upstream divers_erp { server web:3000; keepalive 16; }

    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;

    server {
        listen 8080 default_server;
        server_name _;
        charset utf-8;
        client_max_body_size 64k;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://divers_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # The public site owns its Nitro routes (for example /api/conditions),
        # but never exposes the staff/domain API on the customer origin.
        location /api/v1/ { return 404; }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://divers_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        server_name staff.localhost staff.sharmdiversclub.com;
        charset utf-8;
        client_max_body_size 2m;
        limit_req_status 429;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://divers_backend/actuator/health;
            proxy_set_header Host $host;
        }

        location = /api/v1/identity/login {
            limit_req zone=login_rate burst=6 nodelay;
            error_page 429 = @login_rate_limited;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://divers_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @login_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 12 always;
            return 429 '{"error":"rate_limited"}';
        }

        location /api/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://divers_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://divers_erp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
