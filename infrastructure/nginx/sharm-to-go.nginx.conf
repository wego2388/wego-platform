worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # A travel-request reference (STG-XXXXXXXX) is a bearer secret — see
    # web/apps/sharm-to-go-site/server/api/requests/[reference].get.ts's own
    # comment: anyone who has it, not just the customer, can read that
    # request. Mask it out of both the logged request line and any logged
    # referrer before it ever reaches stdout, rather than relying on nobody
    # needing to read these logs. Verified live (not just `nginx -t` syntax
    # checked): a real request to /track/<reference> logs "/track/[redacted]"
    # on this access log — see the Codex-review-fix-round board entry.
    # Known residual gap, not fixed here: nginx's own built-in error_log
    # (upstream connection failures, etc.) uses a fixed internal format this
    # repo cannot rewrite, and still logs the raw reference when a request
    # to one of these paths hits an actual upstream error — verified live
    # too. Lower-probability (only on real backend failures, not normal
    # traffic) but real; revisit if this ever needs to be airtight rather
    # than defense-in-depth.
    map $request_uri $wego_logged_uri {
        ~^(?<prefix>/(track|api/requests)/)[^/?]+(?<suffix>.*)$ "${prefix}[redacted]${suffix}";
        default $request_uri;
    }
    map $request $wego_logged_request {
        ~^(?<method>\S+)\s\S+(?<proto>\sHTTP/\S+)$ "${method} ${wego_logged_uri}${proto}";
        default $request;
    }
    map $http_referer $wego_logged_referer {
        ~^(?<origin>https?://[^/]+)(?<prefix>/(track|api/requests)/)[^/?]+(?<suffix>.*)$ "${origin}${prefix}[redacted]${suffix}";
        default $http_referer;
    }

    log_format wego '$remote_addr - $request_id [$time_local] "$wego_logged_request" '
                    '$status $body_bytes_sent "$wego_logged_referer" "$http_user_agent" '
                    'correlation_id=$sent_http_x_correlation_id';
    access_log /dev/stdout wego;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream stg_backend { server backend:8080; keepalive 16; }
    upstream stg_site    { server site:3000;    keepalive 16; }
    upstream stg_erp     { server erp:3000;     keepalive 16; }

    # Same edge-level per-IP brute-force limiter web/nginx already uses for
    # the staff login (bcrypt is deliberately slow and writes to Postgres on
    # every attempt). The public site gets a far looser general limiter so a
    # scraper can't hammer the catalog proxy but a real visitor never notices.
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=public_rate:10m rate=20r/s;
    # Anonymous request creation (and its reference lookup) has real
    # backend consequences a page view does not — a DB write, and for an
    # INSTANT service, an immediate confirmation — so it gets its own much
    # tighter limit instead of sharing the general browsing one. 10/min
    # covers a real visitor's own retries after a transient error with
    # room to spare; nowhere near what one legitimate customer needs.
    # Verified live, not just nginx -t syntax checked: hammering
    # /api/requests gets 429 after its burst, while the same burst against
    # / (the general browsing limiter) sails through untouched.
    limit_req_zone $binary_remote_addr zone=request_create_rate:10m rate=10r/m;

    # This edge listens on two internal ports; the TLS front (Caddy) maps
    # each public hostname to one of them, so no server_name/envsubst is
    # needed here. 8080 = public customer site, 8081 = staff admin.

    # ---- Public customer site --------------------------------------------
    server {
        listen 8080;
        charset utf-8;
        client_max_body_size 64k;
        limit_req_status 429;
        limit_req zone=public_rate burst=60 nodelay;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://stg_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # The public site never talks to the staff API from the browser —
        # its own /api/catalog/* Nitro routes call the backend server-side —
        # so the staff API is simply not reachable on the customer hostname.
        location /api/v1/ { return 404; }

        # /api/requests covers both the Nitro proxy's create-request POST
        # and its by-reference lookup GET (server/api/requests/index.post.ts,
        # server/api/requests/[reference].get.ts) — a longer, more specific
        # prefix than location / below, so nginx matches this one first for
        # both. Same proxy target and headers as location /, just a tighter
        # request-specific rate limit in front of it.
        location /api/requests {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            limit_req zone=request_create_rate burst=10 nodelay;
            proxy_pass http://stg_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            # style-src keeps 'unsafe-inline': the site sets inline style
            # attributes (staggered reveal delays, MockPhoto dot texture);
            # script-src keeps it for Nuxt's hydration bootstrap, same
            # reasoning documented in nginx.conf for the ERP.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://stg_site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # ---- Staff admin (ERP dashboard) ---------------------------------------
    server {
        listen 8081;
        charset utf-8;
        client_max_body_size 2m;
        limit_req_status 429;

        location = /healthz {
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://stg_backend/actuator/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /api/v1/identity/login {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            limit_req zone=login_rate burst=6 nodelay;
            error_page 429 = @login_rate_limited;
            proxy_pass http://stg_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location @login_rate_limited {
            internal;
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 12 always;
            return 429 '{"error":"rate_limited"}';
        }

        location /api/ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'" always;
            proxy_pass http://stg_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Staff pages: inline script for Nuxt hydration and the theme
        # flash-prevention script, inline style attributes from the shared UI.
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            proxy_pass http://stg_erp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
